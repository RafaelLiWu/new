ite, o tipo de quietude que só existe quando todo mundo que deveria estar dormindo ainda não está. As lamparinas na configuração noturna, dois terços de chama, fazendo da pedra azulada uma sequência de sombras com intervalos de luz âmbar. Duas portas. Treze metros de distância entre elas.\n\nA parede que as separava tinha noventa centímetros de espessura — pedra sólida, construída para durar séculos, projetada para manter calor no inverno e ruído fora de qualquer conversa privada.\n\nNoventa centímetros.\n\nNão era suficiente. Ou era exatamente suficiente, dependendo do que cada uma das quatro pessoas naquelas duas portas havia decidido saber.\n\nDo lado esquerdo: o quarto de Jayce.\n\nEle havia passado três semanas depois da batalha sendo o que era — o guerreiro sênior, o comandante, a pessoa cujo ombro havia sido enfaixado e que havia lido o relatório de baixas sem comentar porque comentar é o que se faz quando as palavras servem para alguma coisa. Havia feito o trabalho de reconstrução com a precisão de sempre. Havia assinado ordens, revisado treinos, participado de reuniões onde Kaisa apresentava números com a voz que não subia de tom.\n\nO que não havia feito era desaprender o que havia aprendido sobre como ela prendia a respiração.\n\nAurora havia aparecido no caminho dele de um jeito que ele reconhecia porque era o tipo de aparecimento que não é acidente — a pessoa certa no ponto certo com a expressão de quem sabe que é a pessoa certa no ponto certo. Ela havia aparecido duas vezes em contextos funcionais, depois numa conversa real, depois num almoço que havia começado como troca de informação diplomática e havia terminado com ela perguntando, diretamente e sem construção, o que ele achava dela.\n\nEle havia dito a verdade, porque era o que ele fazia.\n\nEla havia sorrido com o sorriso pequeno de quem verifica uma teoria.\n\nEla estava no quarto dele com os óculos ainda no rosto porque não havia tido momento de tirá-los, o que dizia algo sobre a velocidade com que a conversa havia se convertido em outra coisa.\n\nJayce era diferente de Kayn da forma que um rio é diferente de um lago — não em qualidade mas em dinâmica, em movimento, na forma como a água se comporta quando tem direção específica. Ele conduzia com a mesma precisão calculada de tudo que fazia, e a diferença era que Kayn era peso e Jayce era ritmo, e Aurora havia descoberto, nos últimos três anos, que ela respondia bem aos dois por razões completamente diferentes.\n\nEle a tinha embaixo dele.\n\nO impulso de Jayce tinha uma qualidade específica — calculado, construído, o tipo de ritmo que aumenta de forma tão gradual que você só percebe que acelerou quando já está dentro do novo tempo. Aurora acompanhou. Ela era boa em acompanhar quando queria, e quando não queria ela tomava o controle, e com Jayce ela havia descoberto que ele tinha a rara qualidade de pessoas que sabem a diferença entre os dois momentos.\n\nEla mordeu o ombro dele quando ele diminuiu o ritmo de propósito.\n\nNão suave — com a firmeza de quem está comunicando uma preferência.\n\nEle parou por meio segundo.\n\nA olhou de baixo para cima — as pupilas contraídas pela lamparina, os olhos violeta com a qualidade de avaliação que ele usava nos mapas — e então voltou ao ritmo anterior sem comentar. Mas havia um quinto de sorriso no canto da boca que ele não havia tido antes do dente.\n\nOs óculos de Aurora estavam ainda no rosto.\n\nEla foi tirá-los numa pausa.\n\nEle segurou o pulso dela.\n\n— Deixa.\n\nEla o deixou, porque estava curiosa, e porque a curiosidade dela era um instrumento que ela usava em todos os campos.\n\nO que se seguiu foi com os óculos ainda na lente embaçando levemente pelo calor do quarto e pela proximidade dos dois corpos, e Aurora gozou com Jayce fundo dentro dela e com os óculos no rosto e com o nome de ninguém nos lábios — só o som, urgente e rouco como ela ficava quando chegava ao ponto em que o filtro cedia completamente.\n\nDo lado direito: treze metros e noventa centímetros de pedra sólida.\n\nKayn havia achado Kaisa num corredor três semanas antes.\n\nNão havia história para isso. Havia um corredor e a forma que ela estava se movendo pelo corredor — diferente, ele havia registrado com os olhos que observavam mais do que comentavam. A postura de alguém que havia aprendido a ocupar o próprio espaço de outra forma. Não era arrogância — era simplesmente a diferença entre antes e depois de um determinado tipo de conhecimento, que ele reconhecia porque havia visto o mesmo processo em combatentes jovens depois do primeiro campo de batalha.\n\nMas não era isso.\n\nEle havia ficado olhando por tempo suficiente para que ela percebesse que estava sendo olhada, e quando ela virou a cabeça o olhar âmbar já estava esperando.\n\n— Treino de defesa pessoal — ele havia dito. — Para administradores do palácio. Acho razoável que você saiba se defender.\n\nKaisa havia processado isso com a seriedade com que processava logística.\n\n— Faz sentido — ela havia dito.\n\nHavia feito.\n\nO que havia começado como treino havia se tornado, com a velocidade das coisas que eram inevitáveis desde o começo, outra coisa.\n\nNão pela mesma razão que com Jayce — não havia pedagogia aqui, não havia estrutura de ensino. Havia Kayn, que era prático da forma que os machados são práticos, que gostava de ensinar mas ensinava pelo fazer e não pelo dizer. Havia Kaisa, que havia aprendido, nas últimas semanas, que a curiosidade se aplica a todos os campos com a mesma qualidade de atenção.\n\nE havia o fato de que Kayn, no terceiro treino, havia corrigido o ângulo do cotovelo dela vindo por trás — as mãos grandes nos seus antebraços, o corpo dele quente atrás do dela, a temperatura que ela havia aprendido a reconhecer como o antecedente de outra coisa — e ela havia virado a cabeça e encontrado o rosto dele a distância de poucos centímetros.\n\n— Você está ensinando defesa pessoal — ela havia dito.\n\n— Estou — ele havia confirmado.\n\n— Ou está usando isso como pretexto.\n\nOs olhos âmbar tinham a qualidade de quem foi apanhado numa verdade parcial e não vê razão para complicar.\n\n— As duas coisas — ele havia dito.\n\nKaisa havia considerado isso.\n\n— Tudo bem — ela havia dito. — Mas eu quero aprender a técnica também.\n\nEle havia sorrido — um sorriso real, não largo, o tipo que aparecia raramente e por isso tinha peso quando aparecia.\n\n— Combinado.\n\nNo quarto da direita, Kayn ensinava pelo fazer.\n\nKaisa aprendia pelo fazer com perguntas no meio, o que ele havia descoberto ser um método que ele não havia encontrado antes — a maioria das pessoas para de pensar quando o corpo assume, mas Kaisa continuava pensando, o que resultava em interrupções ocasionais para esclarecimentos técnicos que deveriam ter sido absurdos no contexto e que, por alguma razão, não eram.\n\n— Esse ângulo é mais eficiente que o anterior? — ela havia perguntado, em algum ponto entre a segunda e a terceira posição, com a voz que estava levemente diferente mas a dição que estava completamente intacta.\n\nEle havia parado.\n\nA havia olhado.\n\n— Sim — havia dito, porque era verdade e porque mentir para Kaisa parecia não apenas inútil mas estruturalmente errado, como tentar enganar uma calculadora.\n\n— Por quê?\n\nEle havia explicado — brevemente, com a precisão de quem não usa palavras que não precisa. E ela havia assimilado e continuado e ele havia descoberto que explicar para alguém que realmente quer entender o mecanismo tinha uma qualidade diferente de ensinar para alguém que só quer o resultado.\n\nO pau grosso de Kayn dentro dela preencheu diferente — mais pesado, mais lento, uma presença que ela havia aprendido a classificar separadamente de Jayce porque eram coisas diferentes da forma que duas soluções para o mesmo problema são coisas diferentes. Ela gostava dos dois. Por razões diferentes. Que continuavam sendo razões.\n\nEle foi fundo.\n\nEla deixou o pensamento ir.\n\nO orgasmo dela foi o tipo que vem quando o corpo finalmente para de catalogar e apenas existe — uma coisa simples e inteira que ela sentiu da raiz da coluna até os joelhos, que fechou os olhos que ela normalmente mantinha abertos, que fez a mão dela encontrar o antebraço dele sem decisão.\n\nKayn gozou com o som baixo e único que ele fazia quando não conseguia mais segurar — o som que Aurora conhecia, que Kaisa estava aprendendo, que tinha a mesma qualidade em ambos os contextos porque era genuíno e as coisas genuínas não se adaptam ao público.\n\nÀs onze e quarenta e dois minutos da noite, os quatro adormeceram.\n\nNenhum deles sabia o que estava no lado de lá da parede de noventa centímetros.\n\nO corredor ficou quieto. A lamparina do lado esquerdo foi mais rápida — o óleo acabou primeiro, coisa de minutos. A do lado direito durou mais um pouco, depois apagou também.\n\nA parede de pedra ficou no escuro entre as duas portas, silenciosa e grossa e completamente indiferente ao que guardava."},{"id":"ne9dfd89a-4347-4b98-b685-6515f24efda2","title":"Capítulo 2: Colisão","text":"Há conversas que parecem ser sobre uma coisa e são sobre outra.\n\nA reunião de estratégia aconteceu numa terça-feira de manhã — chuva fina no pátio, o tipo de chuva que não molha com convicção mas que torna tudo levemente cinza. A sala de mapas tinha seis pessoas: dois auxiliares de logística, um mensageiro aguardando resposta, Kaisa do lado esquerdo da mesa com o relatório de suprimentos, Jayce do lado direito com o mapa de rotas.\n\nKayn estava na porta quando a reunião terminou.\n\nEle havia chegado no final — não era convocado para esse tipo de reunião, havia passado pelo corredor e visto a porta aberta e ficado por razões que ele não nomeou para si mesmo porque Kayn raramente nomeava as coisas que fazia antes de ver aonde levavam.\n\nOs auxiliares saíram. O mensageiro saiu.\n\nSobraram Kaisa, Jayce, e Kayn na entrada.\n\nKaisa pegou os relatórios e foi embora com a eficiência de alguém que tem seis outras coisas para fazer, o que era verdade e que também era, possivelmente, uma leitura correta do ar na sala.\n\nSobraram dois.\n\nEram do mesmo tipo de homem em aspectos que importavam e de tipos completamente diferentes em aspectos que também importavam, que é a combinação que torna qualquer conversa mais longa do que precisa ser.\n\nAmbos preferiam fazer ao dizer. Ambos comunicavam mais pelo gesto do que pela palavra. Ambos tinham a qualidade específica de pessoas que já mediram o outro antes de começar a falar e que sabem que o outro sabe que foi medido.\n\n— Você voltou há quanto tempo? — Jayce perguntou.\n\n— Três semanas — Kayn disse.\n\nNão era sobre quanto tempo havia voltado.\n\nJayce ficou olhando para o mapa — não examinando, o gesto de alguém que precisa de um ponto de foco que não seja o rosto do outro. Kayn ficou parado na entrada com os braços cruzados, os olhos âmbar sem expressão específica.\n\nA conversa que estava acontecendo não estava sendo dita.\n\nO que estava sendo dito era: rotas de suprimento, previsão de chuva, tempo de viagem até a fronteira norte. O que estava acontecendo era dois homens que haviam chegado ao mesmo território por caminhos diferentes e que estavam se avaliando com a precisão silenciosa de guerreiros que sabem que avaliação precipitada é mais perigosa que espera.\n\n— A fronteira está estável — Jayce disse.\n\n— Por enquanto — Kayn respondeu.\n\nDez minutos. Sem resolução. A conversa terminou com ambos saindo pela mesma porta em direções diferentes.\n\nO problema tinha nome agora, mesmo que nenhum dos dois o houvesse dito em voz alta. Nomear em silêncio era suficiente para existir. E o que existe precisa ser, eventualmente, administrado.\n\nO segundo choque aconteceu na biblioteca.\n\nEra uma tarde sem chuva, compensando o cinza da manhã com um sol de final de tarde que entrava pela janela longa e fazia o carvalho das prateleiras parecer mais escuro do que era. Kaisa estava catalogando. Aurora havia aparecido com o pretexto de devolver um livro que havia pedido emprestado semanas antes — o pretexto era real, o livro existia, mas Aurora com pretextos reais ainda tinha, frequentemente, outras razões.\n\nElas haviam falado sobre o livro. Sobre outras coisas. A conversa havia tomado o ritmo das conversas que elas haviam descoberto ter — mais direta do que os primeiros dias, mais honesta, porque as duas sabiam coisas sobre a outra que tornavam a performance desnecessária.\n\nE então algo havia mudado.\n\nKaisa havia feito um comentário sobre logística de acomodações — algo específico, uma decisão de organização de espaços que havia tomado sem consultar. Um detalhe pequeno. Mas havia nele, Aurora percebeu com a atenção de quem mede as coisas em escalas pequenas, uma independência que não era defensiva — era simplesmente o passo natural de alguém que havia aprendido a confiar no próprio julgamento.\n\nAurora havia ficado quieta por um segundo.\n\nQuando isso mudou.\n\nNão havia mudado num momento específico — havia mudado pelo acúmulo de semanas, da mesma forma que as marés mudam o formato da costa sem que nenhuma onda individual pareça responsável. A Kaisa que havia recebido o amuleto na mesa com o silêncio calculado de quem estava sendo ameaçada era a mesma pessoa que a Kaisa que havia acabado de tomar uma decisão de espaço sem pedir referência externa.\n\nE depois o amuleto.\n\nKaisa o tirou do bolso e o colocou na mesa.\n\nA pedra azul-escura na mesma superfície de carvalho onde havia estado semanas antes, mas desta vez foram as mãos de Kaisa que o colocaram. Aurora olhou para ele. Olhou para Kaisa. As orelhas fizeram um movimento que ela não controlou — o ângulo da surpresa que ela raramente exibia.\n\n— Você foi ao meu quarto — Aurora disse. Não era uma pergunta.\n\n— Você entrou num corredor sem ser convidada — Kaisa respondeu.\n\nA voz de Kaisa estava completamente neutra — não defensiva, não agressiva, o tom de alguém que está apresentando um argumento que considera tecnicamente correto e suficiente.\n\nO silêncio entre elas tinha a textura das coisas que acontecem quando duas pessoas chegam ao mesmo ponto pelo mesmo caminho vindo de direções opostas. Aurora ficou olhando para Kaisa por um tempo longo o suficiente para que qualquer pessoa com menos compostura houvesse desviado o olhar.\n\nKaisa não desviou.\n\nAurora pegou o amuleto. O colocou de volta no pescoço com o gesto automatico de quem está recolocando algo que sempre esteve lá.\n\n— Certo — ela disse.\n\nSó isso.\n\nA palavra tinha duas camadas: a superficial, que era concordância; e a de baixo, que era reconhecimento. Elas eram duas pessoas diferentes das que haviam estado na mesma biblioteca alguns meses antes, e essa diferença não era um problema que precisava ser resolvido — era uma informação que precisava ser incorporada.\n\nNenhuma das duas disse isso. Ambas entenderam.\n\n— O livro — Kaisa disse, eventualmente.\n\n— O livro — Aurora confirmou, e o colocou na prateleira.\n\nMas o que havia mudado não voltava.\n\nO palácio continuou. As rondas, os estoques, as reuniões, os relatórios. Os quatro continuaram existindo nos mesmos corredores com a consciência, agora, de que algo havia se deslocado como se desloca a carga num navio quando o mar muda — o navio é o mesmo, a carga é a mesma, mas o equilíbrio pediu redistribuição e alguém vai ter que subir ao porão.\n\nNão hoje.\n\nNão ainda.\n\nMas o porão sabia o que tinha dentro."},{"id":"n97be69c7-a2c2-4c7d-8f47-84219cdfdb81","title":"Capítulo 3: A Escolha que Machuca","text":"A noite em que Aurora decidiu perguntar não tinha nada de especial.\n\nNão havia chuva, não havia lua visível, não havia nenhum tipo de cenário que tornasse o momento mais fácil ou mais difícil do que precisava ser. Era uma noite de quinta-feira com as lamparinas no brilho habitual e Kayn sentado na beira da cama tirando as botas com o movimento metódico de quem faz aquilo todos os dias porque faz, de fato, todos os dias.\n\nAurora estava de pé perto da janela.\n\nHavia ensaiado a pergunta? Não — Aurora não ensaiava coisas assim. Havia pensado nela durante semanas, havia rodado ao redor dela, havia considerado todas as razões para não fazer e havia encontrado que cada razão era, no fundo, uma forma de não saber algo que ela precisava saber para tomar qualquer decisão que valesse a pena tomar.\n\n— Você ficou com alguém — ela disse. — Durante a ausência.\n\nNão foi uma pergunta. Mas as afirmações que precisam de confirmação têm o peso das perguntas mesmo sem a forma.\n\nKayn parou.\n\nA bota na mão direita, a mão esquerda no cordão. Os olhos âmbar encontraram os dela com a qualidade que eles tinham quando ele havia decidido alguma coisa antes de falar — não hesitação, não cálculo. Era a pausa de alguém que sabe o que vai dizer e está verificando uma última vez se é isso que quer dizer.\n\n— Sim — ele disse.\n\nO quarto não explodiu.\n\nAurora havia esperado, em algum nível que ela não havia admitido que estava esperando, alguma coisa — não explosão, mas algum tipo de resposta interna que correspondesse ao peso do que havia sido confirmado. Uma raiva, um choro, qualquer coisa que chegasse de dentro com a força proporcional.\n\nO que chegou foi mais quieto.\n\nEla ficou olhando para ele por um tempo. Depois foi sentar na cadeira do canto — não na cama, não ao lado dele, na cadeira que ela usava quando precisava de um ponto fixo que não o pertencesse. Kayn ficou onde estava com a bota ainda na mão.\n\nA cauda de Aurora estava imóvel.\n\nEsse era o sinal mais claro de que havia algo sério acontecendo, mais claro do que qualquer expressão, porque a cauda era o único lugar onde ela não havia aprendido a ter controle completo. Ela sabia disso. Kayn sabia disso. O quarto ficou quieto do jeito que fica quando as coisas reais chegam.\n\n— Preciso pensar — ela disse.\n\nNão era vai embora. Não era não consigo te olhar. Era a verdade literal: ela precisava pensar, e pensar com ele na sala era impossível porque ele era a variável que ela estava tentando analisar.\n\nKayn colocou a bota no chão.\n\nSe levantou.\n\nParou um segundo de frente para ela — não para dizer nada, não para tocar, apenas para que ela soubesse que havia registrado o peso do que havia sido pedido e que ia embora porque ela havia pedido e não porque estava fugindo. Havia uma diferença entre as duas coisas e ele sabia que ela sabia a diferença.\n\nDepois foi.\n\nA porta fechou.\n\nAurora ficou sozinha no quarto com a cauda ainda completamente imóvel.\n\nO pensamento chegou em camadas, não em ordem:\n\nEle ficou com alguém.\n\nEu fiquei com Kaisa.\n\nNenhum de nós dois perguntou. Nenhum de nós dois respondeu sem ser perguntado. Seguimos um acordo que nunca dissemos em voz alta, assumindo que o outro estava seguindo também.\n\nMas assumir não é o mesmo que combinar.\n\nE não combinar é a diferença entre um acordo e uma suposição.\n\nEla levantou e foi até a mesa. Ficou olhando para a superfície vazia — onde o amuleto havia estado, onde os copos esquecidos haviam estado, onde ela e Kaisa haviam ficado de frente uma para a outra com a honestidade de quem não tem mais razão para disfarçar.\n\nO que ela sentia sobre Kayn ficando com alguém?\n\nEla ficou com a pergunta o tempo que a pergunta merecia.\n\nA resposta que chegou não era simples. Havia algo que doía — não traição, não era esse o formato do que havia, mas algo mais parecido com o reconhecimento de que ela havia suposto algo sobre o que eram sem verificar, e que verificar agora retroativamente não consertava a suposição, só revelava o tamanho da lacuna entre o que ela havia assumido e o que estava acontecendo.\n\nE havia, separada disso, a percepção de que ela também havia lacunado.\n\nEla havia ficado com Kaisa. Havia gostado. Havia voltado para Kayn e chamado o nome dele com sinceridade porque as duas coisas eram sinceras e não haviam se cancelado, o que significava que o que ela havia assumido sobre si mesma também estava incompleto.\n\nDuas lacunas. Um silêncio construído entre dois, sem nenhum dos dois planejando construir exatamente aquele silêncio.\n\nEla chorou um pouco.\n\nNão muito — Aurora não era o tipo de pessoa que passava tempo longo no choro, não por dureza mas por uma impaciência estrutural com estados que não levavam a nenhum lugar útil. Mas havia algo que precisava sair, e sair sem testemunha era a única forma de sair honestamente.\n\nEntão parou.\n\nEnxugou o rosto com o pulso.\n\nFicou sentada em silêncio por mais um tempo — não chorando, não pensando em círculos, simplesmente deixando o peso assentar até ficar com o formato que ia ter. Peso que assenta é mais fácil de carregar do que peso que oscila.\n\nO que havia entre ela e Kayn não era simples. Nunca havia sido simples — havia sido, durante três anos, suficientemente inteligente para os dois, suficientemente flexível para conter o que cada um era sem pedir que o outro parasse de ser. Mas inteligente e flexível não eram o mesmo que dito em voz alta.\n\nE algumas coisas precisam ser ditas em voz alta para existirem de verdade.\n\nEla foi até a escrivaninha.\n\nPegou um pedaço de papel. Pegou a caneta.\n\nFicou com ambos por um momento, pensando no que havia para dizer que coubesse numa folha e que ele lesse uma vez e entendesse completamente, porque Kayn com mais de uma leitura era Kayn que começava a procurar subtexto onde havia texto direto.\n\nEscreveu uma frase.\n\nDobrou o papel.\n\nDesceu o corredor até o quarto onde ele estava — ela havia ouvido os passos dele pararem três portas adiante, o quarto de hóspede vazio que ele usava quando precisava de espaço, que era raro mas acontecia. Deslizou o papel por baixo da porta.\n\nFicou um segundo do lado de fora.\n\nDepois voltou.\n\nDo lado de dentro do quarto dela, com as costas na porta, as orelhas voltaram gradualmente à posição neutra — não relaxadas, não ansiosas, o equilíbrio precário de alguém que havia feito o que precisava fazer e estava esperando ver o que virinha depois.\n\nA cauda começou a balançar novamente.\n\nDevagar, mas começou."},{"id":"n65147cc9-7dc0-4f8d-9135-20dc2c2c31f4","title":"Capítulo 4: O Momento da Verdade","text":"Algumas coisas não resolvem.\n\nReconhecem.\n\nHá uma diferença entre as duas — resolver implica que o problema volta ao estado anterior ou chega a um estado novo e limpo. Reconhecer implica que o estado em que as coisas estão é real, que foi verificado, e que a partir daqui as escolhas são feitas com as informações certas em vez das supostas.\n\nO palácio tinha, naquela sexta-feira à tarde, o tipo de luz que os dias nublados criam quando nuvens finas passam devagar na frente do sol sem bloquear completamente — uma luz difusa que não criava sombras fortes, que tornava tudo levemente sem bordas. Kaisa havia notado esse tipo de luz antes. Havia uma qualidade nela que tornava os espaços internos mais claramente internos.\n\nA biblioteca estava quieta.\n\nJayce chegou sem bilhete.\n\nKaisa levantou o olhar quando ouviu o passo — havia aprendido a distinguir os passos das pessoas que voltavam sempre para o mesmo espaço, e o passo de Jayce tinha a cadência que ela havia catalogado nos meses anteriores. Ele entrou, fechou a porta com o cuidado de quem não quer que o som da porta seja uma declaração, e foi sentar do lado oposto da mesa.\n\nNão do ângulo diagonal das reuniões.\n\nDireto de frente.\n\nHavia entre eles, sobre a superfície de carvalho, o livro de poesia que havia ficado na mesa meses antes — ela o havia colocado de volta na prateleira e tirado de volta da prateleira pelo menos três vezes, porque havia descoberto que não conseguia decidir se ele pertencia ao lugar onde as coisas de trabalho ficavam ou ao lugar onde as outras coisas ficavam, e que essa dificuldade de classificação era, ela suspeitava, informativa.\n\nJayce ficou olhando para o livro por um segundo.\n\nDepois olhou para ela.\n\n— O que você quer? — ele perguntou.\n\nA pergunta tinha o peso de algo que ele havia pensado antes de fazer. Não era o que você quer desta conversa ou o que você quer de amanhã — era a versão inteira, sem delimitação de escopo, o tipo de pergunta que só funciona quando a pessoa que pergunta está disposta a ouvir a resposta completa.\n\nKaisa ficou com ela.\n\nHavia aprendido, nesses meses, a não preencher o silêncio antes de ter a resposta certa. Havia aprendido outras coisas também — sobre o próprio corpo, sobre a diferença entre saber algo de forma teórica e saber de dentro para fora, sobre o que significa querer alguma coisa sem ter um relatório que justifique a vontade.\n\n— Não sei ainda — ela disse. A honestidade tinha o tom das coisas que ela dizia quando havia verificado que era verdade. — Mas estou aprendendo a perguntar.\n\nJayce ficou quieto por um tempo.\n\nHavia na expressão dele algo que ela estava aprendendo a ler — não da mesma forma que lia relatórios, mas da forma que ela havia começado a ler as coisas que não tinham coluna de número. Era reconhecimento, era o olhar de alguém que recebeu uma resposta que não era a que esperava e que estava decidindo o que fazer com isso.\n\n— Isso é suficiente — ele disse. — Por enquanto.\n\nPor enquanto tinha o peso de uma promessa incompleta — não incompleta por descuido, incompleta porque o que vinha depois de por enquanto dependia de coisas que nenhum dos dois havia terminado de descobrir.\n\nEles ficaram sentados.\n\nSeparados por meio metro de mesa — a distância de uma reunião, não a distância de um quarto. Nenhum dos dois se moveu para fechar essa distância, e havia algo que era suficiente naquilo — a mesa entre eles, o livro de poesia com a caligrafia inclinada à esquerda, a luz difusa da tarde sem sombras fortes.\n\nKaisa abriu o livro.\n\nComo descrever o que é ter alguém próximo o suficiente para que o calor deles seja sentido antes do toque?\n\nEla olhou para a página por um momento.\n\nDepois olhou para Jayce.\n\n— Ela ainda não acertou — ela disse.\n\nEle ergueu levemente as sobrancelhas.\n\n— A autora. — Ela indicou a página. — A descrição ainda está errada. Mas acho que entendo por que tentou.\n\nJayce ficou olhando para ela com a expressão que tinha quando ela dizia algo que ele não havia antecipado — o quinto de sorriso no canto da boca que aparecia raramente e que, quando aparecia, era inteiramente real.\n\n— Talvez ela só precisasse de mais dados — ele disse.\n\n— Talvez — Kaisa concordou, e virou a página.\n\nKayn leu a nota.\n\nUma frase. A caligrafia de Aurora era diferente da caligrafia de Kaisa — inclinada para a direita, com as vogais levemente maiores que as consoantes, o tipo de escrita que traía a velocidade de quem havia escrito enquanto pensava e não depois.\n\nQuero conversar. Não hoje à noite. Mas quero.\n\nEle ficou com o papel nas mãos por um tempo.\n\nA janela do quarto de hóspede olhava para o pátio norte — diferente do pátio sul que a janela do quarto deles olhava, uma diferença de ângulo que mudava completamente o que havia para ver. O pátio norte tinha uma fonte pequena que funcionava em anos de chuva suficiente e não funcionava nos outros, e naquele ano havia chovido suficiente, e a fonte estava funcionando, e o som chegava levemente pela janela fechada.\n\nQuero conversar.\n\nKayn conhecia Aurora há três anos. Havia aprendido, nesse tempo, que Aurora querer conversar era raro o suficiente para ser significativo, e que quando ela queria conversar de verdade ela dizia exatamente aquilo — sem preâmbulo, sem disfarce, com a diretividade que ela usava quando a precisão importava mais do que a suavidade.\n\nNão hoje à noite.\n\nIsso ele entendia. Havia coisas que pediam tempo antes de palavras, e forçar as palavras antes do tempo as tornava menores do que eram.\n\nMas quero.\n\nEsse era o ponto. Esse era o que importava. Não hoje, não agora, mas existe uma conversa que vai existir, e ele estava sendo informado com antecedência porque Aurora era o tipo de pessoa que avisos com antecedência era uma forma de respeito.\n\nEle dobrou o papel.\n\nO colocou no bolso do casaco — não descartou, não dobrou e esqueceu. Guardou.\n\nEla abriu a porta antes que ele batesse.\n\nClaro que abriu. Ela ouvia o passo de Kayn desde a curva do corredor — havia ouvido desde o segundo mês, havia deixado de fingir que não ouvia por volta do quarto. Ficaram um de frente para o outro no vão da porta, a lamparina do corredor criando luz por trás dele e a do quarto criando luz por trás dela, e no meio havia apenas eles dois e a distância de um metro que nenhum dos dois havia ainda atravessado.\n\nEle era grande.\n\nIsso não era novidade — havia sido grande desde o primeiro dia. Mas havia noites em que a diferença de tamanho era apenas física e havia noites em que era também metáfora, e essa era uma dessas últimas.\n\n— A nota dizia que eu quero conversar — ela disse.\n\n— Eu sei — ele disse.\n\n— Não hoje à noite.\n\n— Eu sei — ele repetiu.\n\nO mesmo tom. Sem impaciência, sem decepção, sem o tipo de resistência que algumas pessoas colocam em concordâncias quando estão concordando mas não de verdade. Kayn concordava de verdade — havia aprendido, ela havia aprendido sobre ele, que quando ele dizia que sabia, ele sabia, e quando não sabia ele ficava quieto até saber.\n\nUma das razões pelas quais ela havia se casado com ele.\n\nEla ficou olhando para ele por um segundo mais longo do que a despedida precisava.\n\nHavia entre eles três anos de uma coisa que não tinha nome simples — não era só amor, não era só parceria, era o tipo de construção que duas pessoas erguem quando passam tempo suficiente juntas sem pedir que a outra seja algo que não é. Havia defeitos na construção. Havia lacunas que nenhum dos dois havia nomeado. Mas a estrutura estava de pé e ela sabia, olhando para ele no vão da porta, que o que ela queria não era derrubar a estrutura.\n\nQueria entender o que havia dentro.\n\n— Boa noite — ela disse.\n\nEle inclinou levemente a cabeça — o gesto pequeno que era dele, que ela havia aprendido a ler como também. e estarei aqui quando você quiser.\n\nDepois foi.\n\nAurora fechou a porta.\n\nFicou com as costas na madeira no escuro do quarto — não a madeira da saída, a madeira de dentro, as costas no painel interno da porta que era o lado que ela ocupava, que era o lado de dentro que havia escolhido.\n\nAs orelhas estavam na posição do pensamento — ligeiramente inclinadas para baixo e para fora, o ângulo que ela tinha quando estava processando algo que ainda não tinha forma final.\n\nA lamparina piscou uma vez.\n\nDepois se estabilizou.\n\nE no corredor leste do Palácio das Marés, onde as lamparinas estavam a dois terços de chama na configuração noturna, quatro pessoas existiam nos mesmos metros quadrados de pedra azulada com a consciência de que algo havia sido verificado.\n\nNão resolvido.\n\nVerificado.\n\nOs mapas que cada um havia carregado até ali não eram suficientes para o território em que estavam — não porque eram ruins, mas porque tinham sido desenhados antes de certas viagens, e viagens mudam o que precisa ser cartografado. Para traçar o próximo trecho era necessário primeiro reconhecer onde o mapa antigo terminava.\n\nKaisa apagou a vela da biblioteca.\n\nÀs onze e quinze, como sempre.\n\nO palácio, como sempre, continuou."}]}]},{"id":"nf81853da-89ac-4848-a552-dcc11e908f4a","title":"Depois da Guerra","author":"","synopsis":"","include":true,"acts":[{"id":"n568a6733-1810-4dd8-95fc-04ef34a0b7e2","title":"Ato 1","chapters":[{"id":"ndcba9666-8945-49b6-aedd-dedbaf58cd85","title":"Capítulo 1","text":"Câmara da Comandante — Meia-noite\n\nO quarto cheirava a couro velho, cera derretida e ao tipo de suor que se acumula depois de horas de treinamento — não o suor limpo do esforço, o suor pesado de alguém que passou o dia inteiro a testar os limites do que o corpo aguenta antes de ceder. As velas no suporte de ferro criavam sombras longas nas paredes de pedra. A cama no canto tinha as grades de bronze escurecido pelo tempo e pelo que havia sido preso a elas antes.\n\nRiven estava de pé no centro do quarto.\n\nOs cabelos azul-esverdeados soltos, as mechas roxas caindo pelo ombro esquerdo com a displicência de quem não precisava de nenhum ornamento para ocupar espaço num cômodo. A veste branca estava aberta até a cintura — o faixa de seda roxa entrelaçada ao redor da cintura dela mais decorativa do que funcional, apertada o suficiente para marcar a curva do quadril sem esconder nada que ela não quisesse esconder. Os olhos levemente sombreados pelo kohl, a boca num sorriso que não era afeto — era avaliação.\n\nRakan estava de joelhos no chão de pedra.\n\nTinha chegado há trinta minutos, de uniforme completo, com o relatório de patrulha na mão e a postura de quem havia aprendido a entrar naquele quarto de uma única forma. Os cabelos azul-claros estavam levemente despenteados pelo capacete retirado na entrada. O uniforme — a armadura ornamental rosa e vermelho com as penas decorativas, o colar de ombro que tornava cada posição de cabeça um exercício de atenção — estava na cadeira do canto. O que restava era o soldado em si, sem a armadura que o tornava imponente em campo, apenas o corpo de ombros largos e cintura estreita e a expressão de alguém que havia chegado pronto para isso.\n\n— Relatório — Riven disse.\n\n— Patrulha limpa, comandante. — A voz de Rakan estava calibrada — firme o suficiente para ser inteligível, baixa o suficiente para não soar como se tivesse o controle do que estava acontecendo, porque não tinha. — Nenhuma atividade na fronteira leste.\n\n— Nenhuma atividade. — Ela repetiu as palavras com a qualidade de quem as devolve como uma crítica. Caminhou ao redor dele devagar, os pés descalços silenciosos na pedra. — O que você faz quando não há atividade, Rakan?\n\nEle ficou onde estava, os olhos na frente, as mãos fechadas nos joelhos.\n\n— Espero ordens.\n\n— Espera. — Ela parou atrás dele. Uma pausa. — Tirei a bota errada essa manhã. Qual foi?\n\n— A direita, comandante.\n\n— Não estava no relatório.\n\n— Não era relevante para o relatório.\n\n— Tudo que eu faço é relevante. — A mão de Riven desceu pelos cabelos azuis dele devagar — não carinhosa, possessiva, o tipo de toque que cataloga o que lhe pertence. — Você não presta atenção suficiente.\n\n— Me desculpe.\n\n— Vai ter que ser mais do que desculpa. — Os dedos fecharam no cabelo, puxando a cabeça para trás num ângulo que deixava o pescoço de Rakan exposto. Ele foi — sem resistir, sem endurecer, com a entrega completa de quem havia decidido que entregar era a única coisa que queria fazer naquele cômodo. — Quanto mais do que desculpa?\n\n— O que a comandante achar suficiente.\n\nA corda que Riven usava era de seda trançada — ela havia explicado uma vez, com a objetividade de quem discute técnica, que corda áspera marca de uma forma que demora a desaparecer e que marca que demora a desaparecer era inconveniente em campo. Seda marca também, mas suave, e as marcas somem antes do próximo turno.\n\nRakan ficou de costas na parede, os pulsos presos acima da cabeça no gancho de ferro que estava lá para esse propósito específico, os pés no chão, completamente nu exceto pelas marcas leves onde a armadura havia pressionado a pele durante o dia.\n\nO pênis dele estava duro — havia estado desde que entrou no quarto, desde o momento em que Riven havia aberto a porta e o olhado de baixo para cima com aquele sorriso que não era afeto.\n\nEla ficou parada a dois passos de distância e ficou olhando para ele.\n\nEsse era o momento que ela gostava. O inventário. O peso do olhar enquanto ele ficava exposto à avaliação, sem armadura, sem função, sem nada além do que era quando a armadura estava na cadeira.\n\n— Você está babando? — ela disse.\n\n— Não, comandante.\n\n— Vai estar.\n\nEla veio devagar.\n\nA mão no pênis dele não foi gentil — foi firme, direta, o tipo de pressão que não pergunta e não pede. Ele prendeu a respiração. Ela apertou. Os olhos nele, os dela azuis e relaxados com a satisfação específica de quem tem exatamente o controle que quer ter.\n\n— Vai me dizer o que eu quero ouvir — ela disse.\n\n— O que a comandante quiser ouvir. — A voz de Rakan estava diferente agora — mais baixa, levemente rouca, o controle de soldado cedendo pelas bordas onde o corpo decidia por conta própria. — Só o que ela quiser.\n\n— Isso. — Ela parou. A mão saiu. Ele gemeu involuntariamente — um som curto, não planejado, que saiu antes que ele conseguisse contê-lo. — Isso eu quero ouvir.\n\nA boca de Riven desceu pelo pescoço dele — não beijo, dente. A marca que ela deixou no músculo entre o pescoço e o ombro foi suficientemente forte para durar até amanhã e ela o calculou assim, com a precisão de artesã que sabia o que queria produzir. Ele arquejou. As mãos presas no gancho fecharam em punhos que não tinham nada para segurar.\n\nEla desceu mais.\n\nO peito dele, o estômago — a língua descendo pelo abdômen com a velocidade de quem tinha tempo e sabia que tinha, que a noite inteira pertencia a ela e que a única forma de ele sair daquele gancho era quando ela decidisse. A boca chegou onde o pênis dele estava duro e pesado e ela ficou a um centímetro de distância e ficou parada.\n\nEle estava olhando para baixo para ela.\n\nOs olhos dela olharam para cima para ele.\n\n— Peça — ela disse.\n\n— Comandante...\n\n— Peça direito.\n\n— Por favor. — A voz quebrou levemente. — Por favor, comandante.\n\nRiven tomou o pênis dele na boca com a lentidão deliberada de quem estava provando que cada milímetro era concessão, não direito. A língua no comprimento dele, a pressão calibrada, o ritmo que ela escolhia e não o que o corpo de Rakan estava pedindo com os quadris que tentavam avançar e que ela parava com uma mão espalmada no abdômen — parada, firme, a mensagem clara: meu ritmo, não o seu.\n\nEle estava gemendo sem parar agora — sons baixos que escapavam entre os dentes que ele tentava fechar, o soldado que havia na expressão dele completamente dissolvido pelo que estava acontecendo com o corpo, a buceta quente da boca de Riven ao redor do pênis dele destruindo qualquer compostura que havia chegado com ele.\n\n— Riven — ele disse, sem o título, sem o protocolo.\n\nEla parou.\n\nOlhou para cima.\n\n— O quê?\n\n— Desculpe. Comandante. — Os olhos fechados. — Eu... por favor, não pare.\n\nO sorriso dela era o menor que tinha, o mais real.\n\nNão parou.\n\nA porta abriu.\n\nNão bateu — entrou, com o empurrão de alguém que estava cansada demais para cerimônia. Xayah atravessou o vão da porta e parou.\n\nEla cheirava a batalha — pólvora e terra revolvida e o ferro velho do sangue que não era o dela mas que havia ficado, e havia poeira nas botas e um corte raso no antebraço esquerdo que havia parado de sangrar horas atrás e havia coagulado num risco escuro contra a pele. Os cabelos — normalmente impecáveis na coloração azul-rosada — estavam parcialmente soltos, as mechas coladas ao rosto pelo suor. Os olhos cansados varreram o quarto.\n\nRivan estava de joelhos no chão.\n\nRakan estava preso no gancho.\n\nXayah ficou olhando para os dois por um segundo com a expressão de alguém que voltou de um campo de batalha de oito horas e chegou numa cena que, a qualquer outra hora, seria a última coisa que ela precisava.\n\nMas não era qualquer outra hora.\n\nEra esta hora, com o cansaço nos ossos e a tensão de batalha ainda vibrando nos músculos e o corpo que havia passado o dia inteiro em modo de sobrevivência procurando, com a lógica que o corpo tem quando a mente está esgotada, alguma coisa que não fosse sobrevivência.\n\n— Podem continuar — ela disse.\n\nRiven a olhou por um segundo — o inventário rápido, de cima para baixo, as botas sujas, o corte no braço, o cansaço nos ombros.\n\n— Tira a armadura — Riven disse.\n\n— Acabei de chegar.\n\n— Tira a armadura, Xayah.\n\nNão era um pedido.\n\nXayah ficou um segundo olhando para ela. Depois tirou.\n\nA armadura foi para o chão em partes — não arrumada, não dobrada, simplesmente caindo onde caía enquanto Xayah tirava peça por peça com a eficiência exausta de quem havia feito aquilo centenas de vezes em acampamentos e sabia exatamente o prendedor, o encaixe, a ordem. O uniforme de batalha embaixo revelou o corpo que a armadura cobria — as curvas que o design funcional do uniforme sugeria mas não mostrava, a cintura marcada pelo cinto de combate, as coxas que Rivan havia começado a observar com o tipo de atenção que ela aplicava a tudo que era dela agora.\n\nXayah ficou parada no centro do quarto.\n\nSuja. Cansada. Os olhos violeta com aquela qualidade de quem passou longe demais de descanso.\n\nRiven foi até ela.\n\nA mão no rosto de Xayah — suave desta vez, não possessiva. O polegar tirando uma marca de poeira da maçã do rosto com uma gentileza que não havia estado em nada do que havia feito com Rakan, porque Rakan era o soldado que ela humilhava e Xayah era outra coisa.\n\n— Quantos? — Riven perguntou. Os inimigos. As baixas. O número que Xayah havia carregado de volta.\n\n— Nenhum nosso — Xayah disse.\n\n— Bom.\n\nO beijo foi diferente de tudo que havia acontecido no quarto antes — direto e inteiro, a boca de Riven sobre a de Xayah com a qualidade das coisas que chegam sem negociação. Xayah respondeu com a impaciência do cansaço que tinha chegado ao ponto em que o filtro sumia — a boca abrindo, as mãos no quadril de Riven, o corpo que havia passado oito horas funcionando num único modo finalmente encontrando um modo diferente.\n\n— Você está suja — Riven disse, contra a boca dela.\n\n— Eu sei.\n\n— Fico.\n\nRakan havia ficado quieto no gancho durante isso — não porque havia esquecido que estava lá, mas porque havia aprendido que silêncio era às vezes a única coisa que podia oferecer quando a comandante estava ocupada com outra coisa. Mas o pênis ainda estava duro e o corpo ainda estava com o ritmo que a boca de Riven havia construído e interrompido, e ele ficou vendo as duas com a expressão de quem está sofrendo de uma forma específica que não é exatamente sofrimento.\n\nRiven o olhou.\n\n— Você ainda está lá — ela disse.\n\n— Sim, comandante.\n\n— Bom.\n\nEla foi até ele. Afrouxou a corda o suficiente para que ele pudesse mover os braços, mas não soltou — reposicionou, as mãos de Rakan presas à frente agora. Depois apontou para a cama.\n\nO que se seguiu tinha a lógica das coisas que três pessoas constroem quando duas delas já sabem o que a outra quer e a terceira está cansada demais para qualquer coisa que não seja honesta.\n\nXayah ficou de costas na cama com Riven sobre ela — a boca de Riven no pescoço de Xayah, descendo pela clavícula, os peitos pequenos e sensíveis de Xayah nos lábios dela até Xayah estar arquejando com o cansaço completamente esquecido, os dedos nos cabelos azuis de Riven. A língua de Riven desceu mais — o abdômen, a linha do umbigo, e mais — a bucetinha de Xayah molhada antes que a boca de Riven chegasse lá, o corpo que havia passado o dia em batalha respondendo com a urgência de quem havia esperado sem saber que estava esperando.\n\nRivan lambia com a precisão que aplicava a tudo que fazia — aprendendo o ritmo pelo feedback, encontrando o ponto que fazia Xayah segurar a respiração e ficando nele, e ficando nele, até Xayah ter as coxas fechadas dos dois lados da cabeça dela e os sons que saíam sendo os únicos sons que ela havia feito em horas que não eram sobre batalha.\n\nRakan estava de joelhos atrás de Riven.\n\nAs mãos amarradas à frente, mas os braços livres o suficiente — e Riven havia deixado espaço deliberadamente, tinha curvado levemente o quadril para trás, o convite que não era pedido mas que era claro como uma ordem. Ele entrou nela devagar — sentindo a buceta quente e apertada de Riven ao redor do pênis dele, o ângulo que ela havia escolhido, e ficou no ritmo dela porque era o ritmo dela, sempre.\n\nOs três encontraram uma cadência.\n\nRivan com a boca na buceta de Xayah, os quadris de Riven encontrando os impulsos de Rakan, Xayah com as mãos nos cabelos de Riven e Rakan com as mãos amarradas na cintura dela — o quarto cheio dos sons de três corpos com necessidades diferentes chegando ao mesmo lugar pela mesma rota.\n\nXayah gozou primeiro — com a força de quem havia segurado o dia inteiro sem ter nada para soltar, o orgasmo vindo em onda longa que a fez fechar os olhos e arquear até os ombros saírem do colchão, a voz saindo sem filtro, sem o controle que ela mantinha em campo. Riven sentiu e não parou — ficou naquele ritmo enquanto Xayah trembia, enquanto as coxas apertavam, até Xayah puxar o cabelo dela para parar porque era demais.\n\nRiven então se levantou de Xayah e voltou a atenção para Rakan.\n\nA diferença no olhar era visível — havia estado presente com Xayah, havia estado com ela. Com Rakan o olhar voltava ao modo de antes: avaliação, posse, o sorriso que não era afeto.\n\n— Vai me pedir — ela disse.\n\n— Por favor — ele disse, imediato, sem a hesitação de soldado, com a urgência de alguém que havia esperado tempo suficiente. — Por favor, comandante. Por favor.\n\nEla o deixou ir fundo dentro dela.\n\nO ritmo que ele escolheu quando ela deu o espaço foi o ritmo de alguém que havia esperado demais — urgente, profundo, o pênis grosso dentro da buceta dela com a força que havia estado contida desde que havia entrado no quarto com o relatório de patrulha na mão. Riven ficou com os joelhos na cama e deixou, porque às vezes era isso — não humilhação, só o peso de alguém que queria e havia sido deixado querer o suficiente para que quando chegasse fosse inteiro.\n\nXayah ficou deitada ao lado observando com os olhos semicerrados do cansaço e do que havia acontecido antes, a mão levemente no rosto de Riven enquanto Rakan a tomava por trás, e havia naquele gesto — no toque de Xayah no rosto dela — algo diferente de tudo que havia acontecido antes no quarto.\n\nRakan gozou dentro dela com o som que havia estado preso desde o gancho — baixo, rasgado, os quadris fundo enquanto a gozada quente a preencheu, as mãos amarradas nos quadris de Riven tão firmes quanto as cordas permitiam.\n\nRiven ficou imóvel um segundo.\n\nDepois soltou as cordas dos pulsos dele.\n\nOs três ficaram na mesma cama — Riven no meio, porque era sempre o meio, porque o meio era onde as coisas eram administradas. Xayah de um lado com o corte no braço que Riven havia limpado sem fazer cerimônia nem comentar. Rakan do outro com as marcas de corda nos pulsos que iam durar até amanhã e que ele havia olhado com uma expressão que Riven reconhecia como satisfação.\n\nO quarto cheirava agora a batalha e a cera e a suor e a algo que não tinha nome mas que os três conheciam.\n\n— Relatório amanhã às seis — Riven disse.\n\n— Sim, comandante — Rakan disse.\n\n— Certo — Xayah disse.\n\nA lamparina foi apagada.\n\nO Palácio ficou quieto."}]}]}]}</script>
<script>
(() => {
  'use strict';

  const $ = id => document.getElementById(id);
  const published = document.documentElement.dataset.published === 'true';
  const template = document.documentElement.cloneNode(true);
  const uid = () => 'n' + (
    globalThis.crypto?.randomUUID?.() ||
    Date.now().toString(36) + Math.random().toString(36).slice(2)
  );
  const E = value => String(value ?? '').replace(/[&<>"']/g, char => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[char]));
  const words = text => (text.trim().match(/\S+/g) || []).length;
  const countChapters = book => book.acts.reduce((n,a) => n + a.chapters.length,0);
  const countWords = book => book.acts.reduce(
    (n,a) => n + a.chapters.reduce((s,c) => s + words(c.text),0),0
  );
  const chapter = title => ({id:uid(),title,text:''});
  const act = (number,withChapters=false) => ({
    id:uid(),title:'Ato ' + number,
    chapters:withChapters
      ? Array.from({length:4},(_,i) => chapter('Capítulo ' + ((number-1)*4+i+1)))
      : []
  });
  const newBook = () => ({
    id:uid(),title:'Nova light novel',author:'',synopsis:'',include:true,
    acts:Array.from({length:4},(_,i) => act(i+1,true))
  });

  function notify(message) {
    $('notice').textContent = message;
    $('notice').hidden = false;
    clearTimeout(notify.timer);
    notify.timer = setTimeout(() => $('notice').hidden = true,5000);
  }

  function readStorage(key) {
    try { return localStorage.getItem(key); }
    catch { return null; }
  }

  function writePreference(key,value) {
    try { localStorage.setItem(key,value); } catch {}
  }

  function validate(value) {
    if (!value || value.schema !== 2 || typeof value.id !== 'string' ||
        typeof value.snapshot !== 'string' || !Array.isArray(value.books)) {
      throw new Error('Estrutura de biblioteca inválida.');
    }
    const ids = new Set();
    const validId = id => {
      if (typeof id !== 'string' || !/^[a-zA-Z0-9_-]{1,100}$/.test(id) || ids.has(id)) {
        throw new Error('Identificador inválido ou repetido.');
      }
      ids.add(id);
      return id;
    };
    const str = value => {
      if (typeof value !== 'string') throw new Error('Campo de texto inválido.');
      return value;
    };
    return {
      schema:2,id:value.id,snapshot:value.snapshot,
      books:value.books.map(b => {
        if (!b || !Array.isArray(b.acts)) throw new Error('Atos inválidos.');
        return {
          id:validId(b.id),title:str(b.title),author:str(b.author ?? ''),
          synopsis:str(b.synopsis ?? ''),include:b.include !== false,
          acts:b.acts.map(a => {
            if (!a || !Array.isArray(a.chapters)) throw new Error('Capítulos inválidos.');
            return {
              id:validId(a.id),title:str(a.title),
              chapters:a.chapters.map(c => {
                if (!c) throw new Error('Capítulo inválido.');
                return {id:validId(c.id),title:str(c.title),text:str(c.text)};
              })
            };
          })
        };
      })
    };
  }

  function convertOld(value) {
    if (!value || typeof value.bookTitle !== 'string' ||
        !Array.isArray(value.chapters) ||
        !value.chapters.every(c => c && Number.isInteger(c.act) && c.act > 0 &&
          typeof c.title === 'string' && typeof c.text === 'string')) {
      throw new Error('Backup antigo inválido.');
    }
    const book = {
      id:uid(),title:value.bookTitle,author:'',synopsis:'',include:true,acts:[]
    };
    const groups = new Map();
    value.chapters.forEach(c => {
      if (!groups.has(c.act)) {
        const a = {id:uid(),title:'Ato ' + c.act,chapters:[]};
        groups.set(c.act,a);
        book.acts.push(a);
      }
      groups.get(c.act).chapters.push({id:uid(),title:c.title,text:c.text});
    });
    return [book];
  }

  let data;
  try {
    data = validate(JSON.parse($('library-data').textContent));
  } catch {
    $('app').textContent = 'Não foi possível abrir os dados incorporados neste HTML.';
    return;
  }

  const saveKey = 'novel-studio:' + data.id + ':' + data.snapshot;
  if (!published) {
    try {
      const saved = readStorage(saveKey);
      if (saved) data = validate(JSON.parse(saved));
    } catch {
      notify('O rascunho local não pôde ser lido. Foram abertos os dados deste HTML.');
    }
  }

  let savedOK = true;
  let saveTimer;
  let selectedId = data.books[0]?.id || '';
  let readingSize = Math.max(16,Math.min(28,Number(readStorage('novel-font')) || 20));
  let lastFocusTarget = null;

  const savedTheme = readStorage('novel-theme');
  document.documentElement.dataset.theme = savedTheme ||
    (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.style.setProperty('--reading-size',readingSize + 'px');

  function save() {
    if (published) return;
    clearTimeout(saveTimer);
    try {
      localStorage.setItem(saveKey,JSON.stringify(data));
      savedOK = true;
      updateSaveState('Salvo neste navegador.');
    } catch {
      savedOK = false;
      updateSaveState('Não salvo no navegador. Baixe o editor HTML ou um backup JSON.',true);
    }
  }

  function scheduleSave() {
    updateSaveState('Salvando…');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(save,450);
  }

  function updateSaveState(message,error=false) {
    const target = $('saveState');
    if (!target) return;
    target.textContent = message;
    target.classList.toggle('error',error);
  }

  function route() {
    const [view,id,chapterId] = location.hash.slice(1).split('/');
    return {view:view || 'biblioteca',id,chapterId};
  }

  function go(hash) {
    save();
    if (location.hash === hash) render();
    else location.hash = hash;
  }

  function selectedBook() {
    return data.books.find(b => b.id === selectedId) || data.books[0];
  }

  function activeBook() {
    return data.books.find(b => b.id === route().id);
  }

  function bookLabel(book) {
    return book.title.trim() || 'Novel sem título';
  }

  function flatten(book) {
    return book.acts.flatMap((a,ai) =>
      a.chapters.map((c,ci) => ({...c,act:a.title,ai,ci}))
    );
  }

  function readingLink(book) {
    const list = flatten(book);
    const remembered = readStorage('novel-progress:' + data.id + ':' + book.id);
    const current = list.find(c => c.id === remembered) || list[0];
    return '#ler/' + book.id + (current ? '/' + current.id : '');
  }

  function renderLibrary() {
    document.title = 'Minha Biblioteca';
    const total = data.books.length;
    $('app').innerHTML = `
      <section class="hero">
        <div>
          <p class="eyebrow">Histórias para ficar mais um capítulo</p>
          <h1>Sua próxima história<br>começa aqui.</h1>
          <p>Escolha uma light novel e entre no seu universo.
          Sua leitura continua do último capítulo aberto neste navegador.</p>
        </div>
        ${published ? '' : '<button class="primary" data-action="new-book">＋ Nova light novel</button>'}
      </section>

      <div class="toolbar">
        <input id="searchBooks" type="search" placeholder="Buscar por título ou autor…" aria-label="Buscar light novels">
        <span class="muted">${total} ${total === 1 ? 'obra na biblioteca' : 'obras na biblioteca'}</span>
      </div>

      ${published ? '' : `
        <div class="panel" style="margin-bottom:25px">
          <div class="section-head" style="margin-bottom:10px">
            <div>
              <strong>Prepare sua biblioteca para publicar</strong>
              <p class="help" style="margin:5px 0 0">
                Marque as obras que devem aparecer no site. O HTML de leitura reúne todas as selecionadas.
              </p>
            </div>
            <button class="primary" data-action="export-public">Exportar site HTML</button>
          </div>
          <div class="actions">
            <button class="small" data-action="export-editor">Baixar editor HTML</button>
            <button class="small" data-action="backup">Backup JSON</button>
            <button class="small" data-action="import">Importar backup</button>
            <button class="small" data-action="select-all">Selecionar todas</button>
          </div>
          <div id="saveState" class="save-state" role="status"></div>
        </div>
      `}

      <section class="grid" id="bookGrid" aria-label="Light novels">
        ${data.books.map((b,i) => `
          <article class="book panel" data-book-card="${E(b.id)}"

      <a href="#bookDetails" data-jump="bookDetails">Sobre a novel</a>
      ${book.acts.map((a,ai) => `
        <strong><a href="#act-${E(a.id)}" data-jump="act-${E(a.id)}">${E(a.title || 'Ato '+(ai+1))}</a></strong>
        ${a.chapters.map(c => `<a href="#chapter-${E(c.id)}" data-jump="chapter-${E(c.id)}">${E(c.title || 'Sem título')}</a>`).join('')}

  function render() {
    const r = route();
    const book = data.books.find(b => b.id === r.id);
    if (r.view === 'editar' && book && !published) renderEditor(book);
    else if (r.view === 'ler' && book) renderReader(book,r.chapterId);
    else renderLibrary();
  }

  function download(name,text,type) {
    const url = URL.createObjectURL(new Blob([text],{type}));
    const link = document.createElement('a');
    link.href = url;
    link.download = name;
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url),30000);
  }

  function exportHTML(publicMode) {
    save();
    const books = publicMode ? data.books.filter(b => b.include) : data.books;
    if (publicMode && !books.length) {
      notify('Selecione pelo menos uma novel para exportar.');
      return;
    }
    const embedded = {
      ...data,
      snapshot:uid(),
      books:JSON.parse(JSON.stringify(books))
    };
    const clone = template.cloneNode(true);
    clone.dataset.published = String(publicMode);
    clone.removeAttribute('data-theme');
    clone.querySelector('title').textContent = 'Minha Biblioteca';
    clone.querySelector('#library-data').textContent =
      JSON.stringify(embedded).replace(/</g,'\\u003c');
    clone.querySelector('#app').innerHTML = '<p>Carregando a biblioteca…</p>';
    clone.querySelector('#notice').hidden = true;
    download(
      publicMode ? 'index.html' : 'editor-novels.html',
      '<!DOCTYPE html>\n' + clone.outerHTML,
      'text/html;charset=utf-8'
    );
    notify(publicMode
      ? 'HTML de leitura gerado com ' + books.length + ' novel(s).'
      : 'Cópia editável gerada com todas as novels.'
    );
  }

  function parseBook(text) {
    const reAct = /^\s*Ato\s+([IVXLCDM]+|\d+)(?:\s*[:—–.-]\s*(.*))?\s*$/i;
    const reChapter = /^\s*Cap[ií]tulo\s+(\d+)(?:\s*[:—–.-]\s*(.*))?\s*$/i;
    const lines = text.replace(/\r\n?/g,'\n').split('\n');
    const explicitActs = lines.some(line => reAct.test(line));
    const acts = [];
    let a = null;
    let c = null;
    let prefix = [];
    const closeChapter = () => {
      if (c) c.text = c.text.replace(/\n+$/,'');
    };
    for (const line of lines) {
      const am = line.match(reAct);
      const cm = line.match(reChapter);
      if (am) {
        closeChapter();
        a = {id:uid(),title:line.trim(),chapters:[]};
        acts.push(a);
        c = null;
      } else if (cm) {
        closeChapter();
        if (!a || (!explicitActs && a.chapters.length >= 4)) {
          a = {id:uid(),title:'Ato '+(acts.length+1),chapters:[]};
          acts.push(a);
        }
        c = {id:uid(),title:line.trim(),text:''};
        a.chapters.push(c);
      } else if (c) {
        c.text += line + '\n';
      } else if (line.trim()) {
        prefix.push(line);
      }
    }
    closeChapter();
    const count = acts.reduce((n,item) => n+item.chapters.length,0);
    if (!count) throw new Error('Nenhum capítulo identificado. Use “Capítulo 1 — Título” em uma linha separada.');
    if (prefix.length) {
      throw new Error('Há texto fora dos capítulos. Coloque o título da novel no campo próprio e inicie cada trecho com “Capítulo 1 — Título”.');
    }
    return acts;
  }

  function move(array,from,to) {
    if (to < 0 || to >= array.length) return;
    const [item] = array.splice(from,1);
    array.splice(to,0,item);
  }

  function afterStructureChange(targetId) {
    save();
    render();
    if (targetId) {
      requestAnimationFrame(() => {
        const target = $(targetId);
        target?.scrollIntoView({block:'start'});
        target?.querySelector('input,textarea,button')?.focus({preventScroll:true});
      });
    }
  }

  document.addEventListener('input',event => {
    const el = event.target;
    if (el.id === 'searchBooks') {
      const query = el.value.toLocaleLowerCase('pt-BR').trim();
      let visible = 0;
      document.querySelectorAll('[data-book-card]').forEach(card => {
        card.hidden = !card.dataset.search.includes(query);
        if (!card.hidden) visible++;
      });
      if ($('noResults')) $('noResults').hidden = visible > 0;
      return;
    }
    if (published) return;
    const book = activeBook();
    if (!book) return;
    if (el.dataset.bookField) {
      book[el.dataset.bookField] = el.value;
    } else if (el.hasAttribute('data-act-title')) {
      book.acts[Number(el.dataset.actTitle)].title = el.value;
    } else if (el.dataset.chapterField) {
      const c = book.acts[Number(el.dataset.a)].chapters[Number(el.dataset.c)];
      c[el.dataset.chapterField] = el.value.replace(/\r\n?/g,'\n');
      const counter = $('words-'+c.id);
      if (counter) counter.textContent = words(c.text) + ' palavras';
    } else return;
    updateEditorMeta(book);
    scheduleSave();
  });

  document.addEventListener('change',event => {
    if (published) return;
    const el = event.target;
    if (el.id === 'bookSelect') {
      go('#editar/'+el.value);
      return;
    }
    if (el.dataset.include) {
      const b = data.books.find(b => b.id === el.dataset.include);
      if (b) { b.include = el.checked; save(); }
      return;
    }
    if (el.hasAttribute('data-move-chapter')) {
      const book = activeBook();
      if (!book) return;
      const from = Number(el.dataset.a);
      const to = Number(el.value);
      if (from === to) return;
      const [c] = book.acts[from].chapters.splice(Number(el.dataset.c),1);
      book.acts[to].chapters.push(c);
      afterStructureChange('chapter-'+c.id);
    }
  });

  document.addEventListener('click',event => {
    const jump = event.target.closest('[data-jump]');
    if (jump) {
      event.preventDefault();
      $(jump.dataset.jump)?.scrollIntoView({block:'start'});
      return;
    }

    const button = event.target.closest('button[data-action]');
    if (!button || button.disabled) return;
    const action = button.dataset.action;

    if (action === 'theme') {
      const theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = theme;
      writePreference('novel-theme',theme);
      return;
    }
    if (action === 'library') { go('#biblioteca'); return; }
    if (action === 'font-up' || action === 'font-down') {
      readingSize = Math.max(16,Math.min(28,readingSize + (action==='font-up'?1:-1)));
      document.documentElement.style.setProperty('--reading-size',readingSize+'px');
      writePreference('novel-font',String(readingSize));
      return;
    }
    if (action === 'read-book') {
      const b = data.books.find(b => b.id === button.dataset.book);
      if (b) go(readingLink(b));
      return;
    }
    if (action === 'read-chapter') {
      go('#ler/'+button.dataset.book+'/'+button.dataset.chapter);
      return;
    }

    if (published) return;

    if (action === 'new-book') {
      const b = newBook();
      data.books.push(b);
      selectedId = b.id;
      go('#editar/'+b.id);
      return;
    }
    if (action === 'open-editor') {
      const b = selectedBook();
      if (b) go('#editar/'+b.id);
      else {
        const created = newBook();
        data.books.push(created);
        selectedId = created.id;
        go('#editar/'+created.id);
      }
      return;
    }
    if (action === 'edit-book') {
      go('#editar/'+button.dataset.book);
      return;
    }
    if (action === 'export-public') { exportHTML(true); return; }
    if (action === 'export-editor') { exportHTML(false); return; }
    if (action === 'save') {
      save();
      notify(savedOK ? 'Alterações salvas neste navegador.' : 'Não foi possível salvar. Baixe uma cópia do editor ou backup.');
      return;
    }
    if (action === 'backup') {
      save();
      download('backup-biblioteca.json',JSON.stringify(data,null,2),'application/json;charset=utf-8');
      notify('Backup gerado com todas as novels.');
      return;
    }
    if (action === 'import') {
      $('importFile').click();
      return;
    }
    if (action === 'select-all') {
      data.books.forEach(b => b.include = true);
      afterStructureChange();
      return;
    }

    const book = activeBook();
    if (!book) return;
    const ai = Number(button.dataset.a);
    const ci = Number(button.dataset.c);

    if (action === 'delete-book') {
      if (!confirm('Excluir “'+bookLabel(book)+'” e todos os seus textos? Faça um backup antes se quiser guardar uma cópia.')) return;
      data.books = data.books.filter(b => b.id !== book.id);
      selectedId = data.books[0]?.id || '';
      go('#biblioteca');
      return;
    }
    if (action === 'bulk-import') {
      try {
        const acts = parseBook($('bulkText').value);
        const count = acts.reduce((n,a) => n+a.chapters.length,0);
        if (!confirm(`Identificados ${acts.length} atos e ${count} capítulos. Substituir os atos e capítulos desta novel?`)) return;
        book.acts = acts;
        afterStructureChange('act-'+acts[0].id);
        notify('Texto distribuído. Revise os títulos e a divisão dos capítulos.');
      } catch (error) { notify(error.message); }
      return;
    }
    if (action === 'add-act') {
      const a = act(book.acts.length+1);
      book.acts.push(a);
      afterStructureChange('act-'+a.id);
      return;
    }
    if (action === 'delete-act') {
      if (!confirm('Excluir este ato e todos os seus capítulos?')) return;
      book.acts.splice(ai,1);
      afterStructureChange();
      return;
    }
    if (action === 'act-up' || action === 'act-down') {
      const id = book.acts[ai].id;
      move(book.acts,ai,ai+(action==='act-up'?-1:1));
      afterStructureChange('act-'+id);
      return;
    }
    if (action === 'add-chapter') {
      const c = chapter('Capítulo '+(countChapters(book)+1));
      book.acts[ai].chapters.push(c);
      afterStructureChange('chapter-'+c.id);
      return;
    }
    if (action === 'delete-chapter') {
      if (!confirm('Excluir este capítulo e seu texto?')) return;
      book.acts[ai].chapters.splice(ci,1);
      afterStructureChange('act-'+book.acts[ai].id);
      return;
    }
    if (action === 'chapter-up' || action === 'chapter-down') {
      const id = book.acts[ai].chapters[ci].id;
      move(book.acts[ai].chapters,ci,ci+(action==='chapter-up'?-1:1));
      afterStructureChange('chapter-'+id);
    }
  });

  $('importFile').addEventListener('change',async event => {
    if (published) return;
    const file = event.target.files[0];
    if (!file) return;
    try {
      const incoming = JSON.parse(await file.text());
      const books = incoming.schema === 2 ? validate(incoming).books : convertOld(incoming);
      if (!books.length) throw new Error('O backup não contém novels.');
      books.forEach(b => {
        b.id = uid();
        b.acts.forEach(a => {
          a.id = uid();
          a.chapters.forEach(c => c.id = uid());
        });
      });
      data.books.push(...books);
      selectedId = books[0].id;
      save();
      go('#biblioteca');
      notify(books.length+' novel(s) importada(s). As obras existentes foram mantidas.');
    } catch (error) {
      notify('Não foi possível importar: '+error.message);
    } finally {
      event.target.value = '';
    }
  });

  window.addEventListener('hashchange',() => {
    save();
    render();
    window.scrollTo({top:0,behavior:'instant'});
    if (route().view === 'ler') $('readingHeading')?.focus({preventScroll:true});
  });

  window.addEventListener('pagehide',save);

  window.addEventListener('beforeunload',event => {
    if (published) return;
    if (saveTimer) save();
    if (!savedOK) {
      event.preventDefault();
      event.returnValue = '';
    }
  });

  document.addEventListener('keydown',event => {
    if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 's' && !published) {
      event.preventDefault();
      save();
      notify(savedOK ? 'Alterações salvas neste navegador.' : 'Baixe um backup para guardar as alterações.');
    }
  });

  render();
})();
</script></body></html>
