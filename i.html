<!DOCTYPE html>
<html lang="pt-BR" data-published="true"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Biblioteca de light novels.">
<title>Minha Biblioteca</title>
<style>
:root{
  color-scheme:light;
  --bg:#f7f5f1;--surface:#fffefa;--ink:#292723;--muted:#78736b;
  --line:#e5dfd5;--soft:#eeebe4;--accent:#785941;--on-accent:#fff;
  --danger:#b23c3c;--shadow:0 16px 45px #3425180b;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#181917;--surface:#22231f;--ink:#eeeae1;--muted:#aaa79f;
  --line:#393a33;--soft:#2c2d27;--accent:#dfbb91;--on-accent:#252018;
  --danger:#ff9d9d;--shadow:0 16px 45px #0002;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,sans-serif}
button,input,textarea,select{font:inherit}
button,a,input,textarea,select{touch-action:manipulation}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:default}
a{color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{
  outline:3px solid var(--accent);outline-offset:3px;
}
button,input,textarea,select{border:1px solid var(--line);border-radius:9px}
button{background:var(--surface);color:var(--ink);padding:9px 14px;font-weight:600}
button:hover:not(:disabled){background:var(--soft)}
button.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
button.primary:hover{filter:brightness(.94);background:var(--accent)}
button.danger{color:var(--danger)}
button.small{font-size:12px;padding:6px 10px}
input,textarea,select{width:100%;background:var(--bg);color:var(--ink);padding:11px 12px}
input[type="checkbox"]{width:18px;height:18px;accent-color:var(--accent)}
textarea{resize:vertical;line-height:1.7}
input[type="file"]{max-width:100%}
label{display:grid;gap:6px;font-size:13px;font-weight:650}
small,.muted{color:var(--muted)}
h1,h2,h3,p{margin-top:0}
h1{font:normal clamp(32px,5vw,54px)/1.13 Georgia,serif;letter-spacing:-.035em}
h2{font:normal 27px/1.25 Georgia,serif}
h3{font-size:17px}
p{overflow-wrap:anywhere}
[hidden]{display:none!important}
.topbar{
  position:sticky;top:0;z-index:20;background:var(--surface);
  border-bottom:1px solid var(--line);padding:13px max(18px,calc((100vw - 1260px)/2));
  display:flex;align-items:center;justify-content:space-between;gap:15px;
}
.brand{display:flex;gap:10px;align-items:center;text-decoration:none;font-weight:750;white-space:nowrap}
.brand-mark{background:var(--accent);color:var(--on-accent);border-radius:8px;padding:4px 10px;font-family:Georgia,serif;font-size:21px}
.actions{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.shell{max-width:1260px;margin:auto;padding:44px 24px 90px}
.eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;margin-bottom:13px}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:25px;margin:12px 0 30px}
.hero h1{margin-bottom:12px}
.hero p{max-width:610px;color:var(--muted);margin-bottom:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:22px;box-shadow:var(--shadow)}
.toolbar{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:25px}
.toolbar input{max-width:380px;background:var(--surface)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:22px}
.book{overflow:hidden;padding:0;display:flex;flex-direction:column}
.cover{
  min-height:205px;padding:26px;color:#fff5e9;display:flex;flex-direction:column;justify-content:space-between;
  background:linear-gradient(140deg,#665146,#322f39);border-bottom:1px solid var(--line);position:relative;
}
.cover::after{content:"";position:absolute;inset:12px;border:1px solid #ffffff30;pointer-events:none}
.cover-number{font:italic 46px Georgia,serif;opacity:.5}
.cover-title{font:24px/1.15 Georgia,serif;max-width:90%;overflow-wrap:anywhere;position:relative;z-index:1}
.book:nth-child(3n+2) .cover{background:linear-gradient(140deg,#5b7169,#253b39)}
.book:nth-child(3n) .cover{background:linear-gradient(140deg,#7c6575,#3a324c)}
.book-body{padding:22px;flex:1;display:flex;flex-direction:column;gap:12px}
.book-body h2{font-size:23px;margin:0;overflow-wrap:anywhere}
.book-body p{margin:0}
.synopsis{color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.book-body .actions{margin-top:auto;padding-top:6px}
.check{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:500}
.badge{font-size:11px;background:var(--soft);border-radius:30px;padding:4px 9px;display:inline-block;width:fit-content}
.empty{text-align:center;padding:60px 25px;border:1px dashed var(--line);border-radius:14px}
.empty h2{margin-bottom:12px}
.editor-layout{display:grid;grid-template-columns:230px minmax(0,1fr);align-items:start;gap:26px}
.outline{position:sticky;top:90px;max-height:calc(100vh - 115px);overflow:auto}
.outline a{display:block;padding:6px 0;color:var(--muted);font-size:13px;text-decoration:none;overflow-wrap:anywhere}
.outline a:hover{color:var(--accent)}
.outline strong{display:block;margin:18px 0 3px;font-size:12px}
.editor-main{display:grid;gap:22px;min-width:0}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:17px}
.full{grid-column:1/-1}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}
.section-head h2{margin:0}
.section-head .actions{flex-shrink:0}
.act-block{scroll-margin-top:90px}
.act-header{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:end}
.chapter-editor{border-top:1px solid var(--line);margin-top:22px;padding-top:22px;scroll-margin-top:90px}
.chapter-editor .chapter-body{min-height:260px;font-family:Georgia,serif;font-size:17px;margin-top:12px}
.chapter-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.chapter-top span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.chapter-footer{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-top:10px}
.chapter-footer label{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.chapter-footer select{width:auto;max-width:220px;font-size:12px;padding:5px}
.save-state{font-size:12px;color:var(--muted);min-height:20px;margin-top:10px}
.save-state.error{color:var(--danger)}
details summary{cursor:pointer;font-weight:650}
details[open] summary{margin-bottom:14px}
.help{font-size:13px;color:var(--muted)}
.bulk{min-height:200px;margin-bottom:10px;font-family:monospace;font-size:13px}
.reader-layout{display:grid;grid-template-columns:245px minmax(0,1fr);gap:50px;align-items:start}
.toc{position:sticky;top:90px;max-height:calc(100vh - 120px);overflow:auto}
.toc summary{font-size:14px}
.toc .act-heading{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:750;margin:22px 0 8px}
.toc a{display:block;text-decoration:none;font-size:13px;padding:9px;border-radius:7px;overflow-wrap:anywhere}
.toc a:hover,.toc a.active{background:var(--soft)}
.toc a.active{color:var(--accent);font-weight:750}
.reading{max-width:740px;min-width:0;margin:auto;width:100%}
.reading h1{font-size:clamp(31px,4vw,45px);margin:25px 0 35px;overflow-wrap:anywhere}
.reading-controls{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:35px}
.prose{font:var(--reading-size,20px)/1.95 Georgia,"Times New Roman",serif;overflow-wrap:anywhere;min-height:35vh}
.prose p{margin:0 0 1.35em;white-space:pre-wrap}
.bottom-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--line);margin-top:45px;padding-top:25px}
.reader-counter{color:var(--muted);font-size:12px}
.notice{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:50;max-width:min(600px,92vw);padding:12px 20px;border:1px solid var(--line);border-radius:10px;background:var(--surface);box-shadow:0 8px 35px #0002;font-size:14px}
html[data-published="true"] .author-only{display:none!important}
@media(max-width:850px){
  .editor-layout,.reader-layout{grid-template-columns:1fr}
  .outline{display:none}
  .toc{position:static;max-height:350px}
  .reader-layout{gap:30px}
  .hero{align-items:flex-start;flex-direction:column}
}
@media(max-width:560px){
  .topbar{padding:10px 14px;gap:8px}
  .brand{font-size:13px}
  .brand-mark{font-size:18px}
  .topbar button{padding:8px;font-size:12px}
  .shell{padding:28px 16px 75px}
  .panel{padding:17px}
  .book{padding:0}
  .fields{grid-template-columns:1fr}
  .act-header{grid-template-columns:1fr}
  .chapter-top{align-items:flex-start;flex-direction:column}
  .chapter-footer{align-items:flex-start;flex-direction:column}
  .section-head{align-items:flex-start;flex-direction:column}
  .reader-counter{display:none}
  .cover{min-height:180px}
  .toolbar input{max-width:none}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;transition:none!important}
}
@media print{
  .topbar,.toc,.reading-controls,.bottom-nav,.notice{display:none!important}
  body{background:white;color:black}
  .reader-layout{display:block}
  .shell{padding:0}
  .prose{font-size:12pt}
}
</style>

<script type="application/json" id="library-data">{"schema":2,"id":"minha-biblioteca-v2","snapshot":"n07e6e949-1bde-45d4-9ac5-103075c56713","books":[{"id":"nf49da4b1-d965-4974-a007-5470f5683e5d","title":"Palácio das Marés","author":"Rafael","synopsis":"Inocência que encontra o mundo. Quatro personagens em equilíbrio — antes de qualquer ruptura.","include":true,"acts":[{"id":"n56bc8c7e-3185-4e54-bd02-956044a09685","title":"ATO 1 — O DESPERTAR","chapters":[{"id":"ne113ab13-87b5-493c-a065-6939493a1d6d","title":"Capítulo 1: A Garota do Palácio","text":"O sino do palácio batia às seis da manhã.\n\nKaisa acordou às cinco e quarenta e dois.\n\nSempre acontecia assim — o corpo dela era mais pontual que qualquer relógio de corda, mais confiável que as velas de medição que o chefe de suprimentos insistia em comprar e que inevitavelmente derretiam tortas. Ela não sabia explicar o mecanismo. Simplesmente acordava, olhava para o teto de pedra azulada e sabia que tinha dezoito minutos antes que o corredor enchesse de barulho.\n\nUsou sete desses minutos no banho — água fria, sempre água fria, porque o aquecimento demorava quarenta minutos e ela não tinha quarenta minutos. A pedra do banheiro cheirava a musgo e a cera de abelha, o cheiro permanente daquele ângulo do palácio onde o sol batia de tarde mas nunca de manhã. Kaisa enxugou os cabelos prata com a toalha grossa de linho, o tipo de tecido que arranhava levemente a pele e que ela preferia por isso — acordava o rosto de vez. Os reflexos lavanda apareceram quando ela se aproximou da janela estreita: a madrugada ainda não tinha se decidido entre azul e cinza, e naquele limbo as madeixas pareciam tingidas por alguém que não conseguia escolher uma só cor.\n\nRelatórios de estoque ficavam na biblioteca, segundo andar, corredor leste.\n\nEla estava lá às seis e um.\n\nO café que o assistente de turno deixava na pequena mesa de madeira ao lado da janela esfriava sempre no mesmo ponto da leitura — no terceiro relatório, invariavelmente, quando o número de páginas aumentava e o ritmo de anotações acelerava. Kaisa tinha parado de tentar beber o café quente. Havia, naquele ritual de esquecimento e esfriamento, uma espécie de honestidade que ela encontrava confortável.\n\nDepósito B-7: sabão em barra, uso doméstico.\nInventário registrado: 847 unidades.\nInventário verificado último mês: 212 unidades.\n\nEla ergueu o olhar da página.\n\nMarta apareceu às seis e vinte — exatamente como havia pedido na nota da noite anterior, embora a hora que Kaisa havia pedido fosse seis e trinta. Marta era daquelas pessoas que chegavam cedo como forma de protesto silencioso contra qualquer reunião que ela considerasse desnecessária, o que incluía a maioria das reuniões.\n\n— Está vendo? — Marta disse, sem bom-dia, sem preâmbulo, as mãos grossas cruzadas na frente do avental. Tinha a postura de uma coluna de pedra e o mesmo tipo de imovibilidade. No palácio, os guardas novos chamavam-na de a Fortaleza quando achavam que ela não ouvia. Ela sempre ouvia. — Três dias de sabão. Três. O relatório diz duas semanas, mas o depósito diz três dias. Alguém mentiu, ou alguém não sabe contar.\n\n— Ninguém mentiu — Kaisa disse, passando o dedo pelo número. — Transpuseram dois dígitos. Oito-quatro-sete virou oito-sete-quatro. Duzentas e trinta e cinco unidades de diferença. — Ela anotou o nome do responsável pelo registro sem raiva e sem dramatismo, a caligrafia regular e firme. — Vou corrigir o inventário e enviar uma ordem de reabastecimento urgente antes do almoço. Você tem materiais alternativos para as próximas horas?\n\nMarta a encarou por um segundo.\n\n— Tenho.\n\n— Então está resolvido.\n\n— Você trabalha demais — Marta murmurou, virando para sair. Era meio elogio, meio diagnóstico, o tipo de coisa que a mulher dizia quando queria reconhecer algo sem parecer sentimental.\n\n— Alguém tem que fazer — Kaisa respondeu, sem levantar o olhar do caderno.\n\nA manhã seguiu assim: relatório, anotação, relatório, anotação. O café esfriou. A luz da janela passou de cinza para amarelo fraco. Em algum momento entre o sétimo e o oitavo relatório, o sino finalmente bateu seis vezes e o corredor encheu do barulho habitual de passos e vozes e portas, e Kaisa o ignorou completamente.\n\nA tarde trouxe Doran.\n\nDezoito anos, orelhas que eram levemente grandes para o rosto ainda em processo de decidir que forma queria ter, postura de quem passava tempo considerável tentando parecer mais alto sem crescer mais. Kaisa havia assinado a contratação dele como guarda do corredor leste há três meses, baseada exclusivamente na qualidade das referências e na consistência do relatório de treinamento. Doran era competente, pontual, e invariavelmente vermelho quando falava com ela, o que Kaisa havia catalogado mentalmente como timidez profissional e considerado irrelevante para a função.\n\nEle apareceu na entrada da biblioteca com o capacete na mão, o que era incomum.\n\n— Senhorita Kaisa.\n\n— Doran. — Ela não levantou o olhar imediatamente. Havia um número que precisava verificar. — Relatório do turno?\n\n— Não é sobre o turno. — Uma pausa. — É que... eu queria perguntar uma coisa.\n\nAí ela olhou.\n\nDoran estava de um vermelho que subia do pescoço até as orelhas grandes, e ele rodava o capacete nas mãos num movimento circular que devia estar amassando levemente o couro. Kaisa inclinou levemente a cabeça. A pergunta estava por vir, isso era claro; ela esperou.\n\n— A senhora já... foi com alguém?\n\nKaisa processou a frase.\n\nIr com alguém. Destino, companhia, saída — ela mapeou rapidamente as opções e selecionou a mais direta.\n\n— Esta semana, não. Estou muito ocupada com os relatórios de reabastecimento. — Ela voltou ao caderno. — Se precisar de acompanhamento para alguma tarefa externa, passe pela chefia de logística.\n\nO silêncio de Doran durou exatamente dois segundos.\n\n— Sim, senhorita. Com licença.\n\nEle saiu mais vermelho do que havia entrado, o que Kaisa achou ligeiramente preocupante do ponto de vista de saúde circulatória. Depois anotou no canto da página: Doran — pergunta estranha. Verificar se as rotas externas estão sobrecarregadas.\n\nÀ noite, a biblioteca ficava diferente.\n\nO mesmo espaço, as mesmas prateleiras de carvalho escurecido pelo tempo, as mesmas fileiras de relatórios encadernados ao lado de tratados de comércio ao lado de almanaques que ninguém havia consultado em décadas — mas à noite o teto desaparecia na sombra, e as lamparinas criavam círculos de luz que faziam o resto do cômodo parecer não existir. Kaisa gostava disso. Era mais fácil pensar quando o mundo encolhia para o tamanho de uma mesa.\n\nEla estava no terceiro relatório da pilha da noite quando o livro apareceu.\n\nNão apareceu, exatamente — estava ali desde sempre, um volume fino e sem título na lombada, encaixado entre dois almanaques de comércio do porto com a naturalidade discreta das coisas que foram esquecidas há tempo suficiente para se tornarem mobília. Kaisa o tirou porque precisava do almanaque ao lado e o livro estava ligeiramente inclinado, tomando espaço indevido.\n\nAbriu numa página do meio, por acaso.\n\nA caligrafia era antiga, inclinada para a esquerda, o tipo de letra de quem havia aprendido a escrever em outro idioma primeiro e nunca se livrou completamente disso. O papel cheirava a sal e a algo seco que ela não conseguia nomear. Ela leu:\n\nComo descrever o que é ter alguém próximo o suficiente para que o calor deles seja sentido antes do toque? A antecipação. O milímetro entre a pele e a pele. O momento em que o espaço entre dois corpos passa a ser o único lugar do mundo que importa.\n\nKaisa ficou com os olhos na página por mais tempo do que a leitura exigia.\n\nComo descrever o que é ter alguém próximo o suficiente para que o calor deles seja sentido antes do toque.\n\nEla sabia, de forma teórica e bastante completa, o que o texto estava descrevendo. Havia lido sobre isso em contextos suficientemente variados. Era um conjunto de reações fisiológicas com base neurológica documentada, associadas a proximidade física e a antecipação de contato — eram compreensíveis, eram humanas, eram a razão pela qual o planejamento de acomodações do palácio precisava considerar privacidade adequada para os hóspedes.\n\nMas o livro não estava descrevendo uma reação fisiológica.\n\nEstava descrevendo o milímetro entre a pele e a pele. O espaço que passa a ser o único lugar do mundo que importa.\n\nKaisa fechou o livro.\n\nFicou olhando para a janela por — ela verificou depois, pela posição da lamparina — aproximadamente três minutos. Não pensou em nada específico. Havia uma névoa que subia do pátio lá embaixo, e o cheiro de pedra molhada que entrava pela fresta, e o som longínquo de algum guarda mudando de turno, e nada disso era diferente de qualquer outra noite.\n\nEla foi dormir às onze e quinze, como sempre.\n\nO livro ficou na mesa."},{"id":"n949634ee-0821-4251-a4c7-00a066b3bb3e","title":"Capítulo 2: O Toque Inesperado","text":"A nota chegou às dez da manhã.\n\nKaisa a leu três vezes porque na primeira passagem achara que havia entendido errado — mas não, a nota dizia de fato enviada diplomática, chegada prevista para hoje ao meio-dia, Delegação de Aurora Velrune, favor preparar o protocolo de recepção. Eram dez da manhã. A chegada prevista era meio-dia. O protocolo completo levava três horas mínimas de preparação.\n\nKaisa respirou uma vez, dobrou a nota, e começou.\n\nÀs onze e cinquenta e oito ela tinha: os aposentos de hóspede no ala leste abertos e verificados, a escala de recepção ajustada, o protocolo de segurança revisado para um membro de delegação, e uma lista completa de honras diplomáticas devidas ao status de enviada — que ela havia pesquisado em sete minutos nos almanaques porque a nota não especificava o cargo exato e ela precisava ter as variáveis cobertas.\n\nO que ela não tinha era qualquer ideia de como era Aurora Velrune.\n\nA imagem mental que Kaisa havia formado, baseada nas referências documentais de delegações similares, era: adulto, faixa dos quarenta a cinquenta anos, formalidade alta, provável preferência por protocolos escritos sobre encontros informais, possivelmente acompanhado de um assistente. Ela havia preparado a sala de recepção com duas cadeiras e chá.\n\nA porta principal abriu às doze e três minutos.\n\nAurora Velrune entrou no corredor como se o corredor fosse um lugar que ela havia decidido explorar por capricho, com as orelhas — orelhas de raposa, Kaisa registrou, recalibrando toda a leitura — inclinadas para a frente no ângulo exato de curiosidade ativa, e a cauda cor de cobre varrendo levemente o ar atrás dela enquanto caminhava. Ela era pequena, tinha cachos ruivos que desafiavam qualquer tentativa de contenção, óculos de lente redonda que emolduravam olhos violeta com uma expressão que Kaisa só conseguia descrever como calculando enquanto se diverte. Carregava uma bolsa de couro sobre o ombro e nenhum assistente.\n\nKaisa estava à sua espera com a lista de protocolo nas mãos.\n\nAurora olhou para a lista. Olhou para Kaisa. Olhou de volta para a lista.\n\n— Você preparou isso pra mim? — disse ela.\n\n— A delegação não especificou o cargo exato do enviado — Kaisa respondeu, com a naturalidade de quem estava relatando um fato. — Preparei o protocolo para três variantes diferentes de status diplomático. Esta é a mais adequada para enviada, com as honras correspondentes.\n\nAurora ficou olhando para ela por um segundo.\n\nDepois riu.\n\nNão foi uma risada contida ou educada — foi uma risada genuína e sonora que ecoou na abóbada de pedra do corredor, o tipo de som que não combinava com nenhum protocolo de nenhuma lista. A cauda dela balançou de um jeito diferente das orelhas, como se os dois elementos do humor tivessem assinaturas próprias. Kaisa ficou onde estava, segurando a lista, e esperou.\n\n— Desculpa — Aurora disse, sem parecer particularmente arrependida. — É que a última vez que alguém preparou um protocolo pra mim foi há dois anos, e eles erraram o título na placa de entrada. Você não errou nada. — Ela estendeu a mão. — Aurora.\n\n— Kaisa. — Ela apertou. A mão de Aurora era menor do que parecia, com os dedos finos e ágeis de quem trabalhava com precisão. — Se a senhora quiser seguir, mostro os aposentos.\n\n— A senhora. — Aurora ergueu uma sobrancelha. — Você pode me chamar de Aurora.\n\n— Se preferir.\n\n— Prefiro.\n\nElas caminharam.\n\nA tarde foi, por qualquer padrão razoável, uma série de situações em que Kaisa estava tentando apresentar informações relevantes e Aurora estava encontrando graça em tudo.\n\n— O teto é muito alto — Aurora disse, no aposento de hóspede, olhando para cima com as orelhas inclinadas para os lados — o ângulo da estimativa, Kaisa havia começado a perceber. — O eco deve ser incrível.\n\n— A acústica do corredor leste é uma consequência da construção original, que priorizava ventilação natural — Kaisa explicou. — Às vezes é inconveniente para conversas privadas.\n\n— Útil para saber — Aurora disse, de um jeito que soava como se estivesse anotando mentalmente.\n\nEla testou a cama pressionando a palma contra o colchão. Ela abriu as janelas e ficou olhando o pátio por tempo suficiente para que Kaisa se perguntasse se havia algo errado com o pátio. Ela examinou o espelho de corpo inteiro no canto com a mesma expressão de quem estava conferindo uma teoria sobre si mesma.\n\n— Você sempre tão literal? — Aurora perguntou, enquanto inspecionavam os armários.\n\n— Não entendo a pergunta.\n\n— Quando eu disse que o eco era incrível, não estava perguntando sobre arquitetura.\n\nKaisa processou isso.\n\n— Ah — disse. — Era para eu rir.\n\n— Era para um dos dois rir — Aurora confirmou, com uma ponta de divertimento que não chegava a ser crueldade. — Tudo bem. É um tipo de humor que funciona melhor de longe.\n\n— Anoto isso.\n\nAurora a olhou de lado.\n\n— Você realmente anota as coisas?\n\n— Tenho um caderno. — Kaisa considerou por um momento. — Você vai aparecer nele.\n\nAquilo, por alguma razão, fez Aurora sorrir de um jeito diferente dos anteriores — menor, mais real, como se tivesse chegado sem planejamento.\n\nO toque aconteceu sem intenção, às quatro e dezessete da tarde, verificando a janela do aposento principal.\n\nA janela tinha um trinco duplo — mecanismo antigo, confiável, com a peculiaridade de precisar ser operado em sequência específica ou travava no intermediário. Kaisa estava explicando isso de costas para o pátio, os dedos no ferrolho de bronze, quando Aurora se inclinou para ver melhor o mecanismo.\n\nO aposento era estreito naquele canto.\n\nAurora perdeu o equilíbrio por uma fração de segundo — o tipo de desequilíbrio pequeno e involuntário que acontece quando o pé escorrega um centímetro no piso de pedra liso. A mão saiu instintivamente para se estabilizar.\n\nE pousou.\n\nPressionou brevemente, com o peso natural de um apoio, no lugar entre as coxas de Kaisa — o tecido da roupa, a pressão distribuída pela palma inteira, e depois retirada tão rapidamente quanto havia chegado quando Aurora recuperou o equilíbrio.\n\nKaisa parou no meio da frase sobre o ferrolho secundário.\n\nO silêncio durou talvez dois segundos.\n\n— Desculpa — Aurora disse. A voz estava completamente neutra, o tipo de neutralidade que se instala quando alguém está controlando de forma deliberada o que está mostrando. As orelhas não se moveram — e Kaisa, que já havia aprendido que as orelhas de Aurora eram o indicador mais honesto da mulher, notou a ausência do movimento antes de poder nomear o que isso significava.\n\n— Está tudo bem — Kaisa respondeu, e continuou a explicação do trinco.\n\nEla a terminou. A voz não subiu de tom. As mãos no ferrolho de bronze não tremeram. A parte de Kaisa que registrava informações registrou o toque e o arquivou junto com a pressão, a temperatura, a duração — dados sem categoria ainda, sem nome ainda, que ficaram ali exatamente como ficam as coisas que o corpo lembra antes que a mente saiba o que fazer com elas.\n\nAurora ficou do lado dela até o fim da demonstração, depois disse que estava bem orientada e que não precisava de mais nada por enquanto.\n\nKaisa saiu do aposento.\n\nDesceu a escada.\n\nAbriu o caderno.\n\nFicou olhando para a página em branco por um momento e depois a fechou sem escrever nada.\n\nAurora fechou a porta do aposento e ficou parada no centro do quarto por um tempo longo o suficiente para que as orelhas se movessem sozinhas, de volta à posição de curiosidade — mas diferente desta vez. Não curiosidade sobre o corredor ou o teto ou o trinco. Curiosidade sobre o jeito que Kaisa havia continuado a frase sobre o ferrolho como se não tivesse acontecido nada, e ao mesmo tempo sobre o micro-segundo de pausa que havia acontecido antes disso.\n\nEla levou os dedos brevemente ao cristal no pescoço — o amuleto pequeno, de pedra azul-escura, que ela usava há anos como item de registro passivo. Inativo agora, como estava quase sempre.\n\nA pontas dos dedos ainda tinham a memória da textura do tecido de Kaisa.\n\nA cauda de Aurora balançou.\n\nEla a observou com a expressão de quem está recebendo informação não solicitada de uma parte do próprio corpo.\n\n— Certo — ela disse, para a cauda, em voz baixa, sem audiência.\n\nA cauda não respondeu mas também não parou."},{"id":"n97e51c48-e3af-4868-8cc0-935a947ddd84","title":"Capítulo 3: Sangue e Promessas","text":"A mensagem chegou às três da manhã, no formato de um pombo com a pluma vermelha que significava fronteira norte.\n\nKaisa estava acordada — não por pressentimento, mas porque havia encontrado uma discrepância no relatório de provisões que não conseguia resolver por dedução e havia decidido esperar o amanhecer no escritório. Quando o mensageiro bateu na porta ela já tinha o mapa da fronteira aberto na mesa.\n\nLeu o relatório. Leu de novo. Anotou os números.\n\nDepois foi acordar os comandantes.\n\nJayce estava no mapa antes que ela chegasse.\n\nEla o conhecia por função antes de conhecê-lo de perto — comandante sênior, cargo confirmado dois anos antes dela assumir a administração, reputação que chegava antes das apresentações na forma de relatos de guardas que haviam servido às suas ordens e que falavam sobre isso com uma mistura específica de respeito e exaustão que Kaisa havia aprendido a reconhecer como o sinal de alguém que pede muito porque dá tudo. O martelo de cristal que carregava era pesado o suficiente para que os guardas mais novos apostassem se ele conseguia erguê-lo com uma mão só. Conseguia.\n\nEle olhou para ela quando ela entrou na sala de mapas. O olhar violeta era do tipo que avaliava e arquivava ao mesmo tempo, sem hostilidade e sem protocolo.\n\n— Kaisa. Quantos homens temos na rota de suprimento da norte?\n\n— Trinta e dois ativos, oito em reserva — ela respondeu sem hesitar. Havia verificado o número três horas antes. — A reserva pode ser acionada em uma hora se o aviso sair agora.\n\nEle ficou olhando para ela por um segundo mais longo que o necessário para o conteúdo da resposta.\n\n— Sai agora — ele disse, e voltou ao mapa.\n\nKaisa enviou o aviso.\n\nAs horas seguintes foram de logística pura: rações calculadas por dias, não semanas, porque semanas era otimismo que não cabia num relatório honesto. Rotas de abastecimento traçadas em três opções com notas de viabilidade em cada uma. Mensageiros coordenados em turnos de quatro horas. Kaisa coordenou tudo disso de um escritório improvisado ao lado da sala de mapas, com três auxiliares e um volume de informação que teria sido esmagador se ela parasse para medir.\n\nEla não parou.\n\nEm algum ponto da manhã Jayce veio buscar confirmação de um número de tropas — ele estava calculando pressão de avanço, precisava de uma margem de variação. Kaisa passou o número sem consultar nada, a partir da memória do relatório, com a precisão de quem havia memorizado a grade inteira. Ele anotou. Estava indo embora quando parou na porta.\n\n— Você dormiu?\n\n— Não.\n\n— Você vai dormir?\n\n— Depois.\n\nEle considerou isso por um momento, como se estivesse avaliando a validade logística da resposta. Depois foi embora sem comentar.\n\nKaisa ficou olhando para o espaço que ele havia ocupado na porta por meio segundo.\n\nDepois voltou ao trabalho.\n\nA batalha ela não viu.\n\nFicou sabendo por fragmentos — o pombo de hora em hora, depois de meia em meia hora quando a coisa aprofundou, a pluma vermelha cada vez mais manchada pelos dedos do mensageiro que corria. Ficou sabendo pela feição dos guardas que voltavam antes da linha principal, os que haviam ido entregar suprimentos e tinham sido dispensados antes que o centro cedesse — eles chegavam com o cheiro de ferro e fumaça e o olhar de quem está processando algo em camadas.\n\nO que ela conhecia da guerra era o papel.\n\nO que os papéis não tinham conseguido transmitir, ela entendeu naquela tarde: que baixas era uma palavra que cabia em três letras e que, quando você era a pessoa que havia calculado o número de rações que elas precisariam, as três letras tinham um peso diferente.\n\nEla fez o relatório de baixas ela mesma — não porque era obrigação dela, mas porque fazer algo concreto era o único antídoto funcional para o que estava sentindo sem saber como nomear. Separou os números por seção. Conferiu duas vezes. Dobrou o papel com cuidado. Esperou.\n\nJayce chegou com o ombro rasgado.\n\nNão rasgado como metáfora — o couro da armadura havia cedido numa faixa diagonal da espádua ao meio das costas, e abaixo havia carne. Ele entrou na enfermaria de campo com a expressão de quem já havia contado as perdas e havia arquivado essa contagem num lugar que só abriria mais tarde, quando houvesse silêncio suficiente. A enfermeira de turno estava com outras três pessoas. Kaisa estava esperando com curativos e o relatório.\n\nEles trabalharam em silêncio.\n\nEla havia feito isso antes — a administração do palácio incluía emergências médicas menores, e ela havia aprendido o procedimento básico de curativo por manual, depois por prática. As mãos eram firmes. O silêncio entre eles não era desconfortável — era o tipo de silêncio de duas pessoas que tinham feito um trabalho longo e não precisavam de conversa para confirmá-lo.\n\nJayce leu o relatório enquanto ela enfaixava o ombro. Leu em silêncio, página por página, sem expressão. Dobrou quando terminou. Ficou com o papel nas mãos por um momento.\n\n— Você separou os números — ele disse. Não era uma pergunta.\n\n— Para não ter que ouvir mais de uma vez.\n\nEle virou a cabeça levemente para olhá-la. Ela estava terminando o nó do curativo, os dedos no tecido de linho, e não estava olhando para o rosto dele.\n\n— Obrigado — ele disse.\n\n— Só logística.\n\n— Não era só logística.\n\nEla não respondeu. Deu o último nó e levantou o olhar para verificar a posição do curativo — e ele estava olhando para ela. Os olhos violeta tinham a qualidade da tarde neles, o tipo de olhar que carregava peso acumulado sem pedir que ele fosse notado.\n\nKaisa foi retirar a mão.\n\nEle a segurou pelo pulso.\n\nNão com força — com a precisão específica de alguém que sabia exatamente a diferença entre segurar e prender, e havia escolhido a primeira coisa. Os dedos envolviam o osso fino do pulso dela com uma temperatura que ela registrou antes de registrar qualquer outra coisa sobre o toque.\n\nEla olhou para cima.\n\nEle estava mais perto do que ela havia calculado — ou ela havia calculado a distância sem incluir o movimento dele na variável, o que era um erro de lógica que a parte de Kaisa que pensava em lógica notou e imediatamente abandonou, porque o beijo chegou antes de qualquer conclusão.\n\nLento. Cuidadoso. Com gosto de poeira e de esforço contido e de algo que ela não tinha referência para nomear. Kaisa ficou com os olhos abertos por um momento — vendo o rosto dele de perto, a linha da sobrancelha, a textura da pele marcada pelo dia — e depois fechou-os no instante exato em que entendeu o que estava acontecendo.\n\nNão era como o texto do livro de poesia.\n\nO livro havia descrito o milímetro entre a pele e a pele. Mas o beijo não era o milímetro — era o que vinha depois do milímetro, quando o espaço finalmente cedia.\n\nEla colocou a testa contra o queixo dele quando o beijo terminou.\n\nTrês segundos. Quatro.\n\nEle não soltou o pulso.\n\nA lamparina entre eles balançou no vento da janela aberta, e a luz fez sombras que duraram menos que o momento, e depois se estabilizou."},{"id":"n6a08524d-a13a-4a6f-b43e-90e667f74bcd","title":"Capítulo 4: A Arte de Dominar","text":"O bilhete não tinha assinatura, mas Kaisa reconheceu a caligrafia — a mesma que havia assinado ordens de batalha com ela por uma semana, precisa e levemente inclinada para a direita, como alguém que havia aprendido a escrever sob pressão.\n\nVenha ao quarto 14 quando puder. Não é urgente.\n\nEla dobrou o bilhete. Ficou olhando para ele por um momento.\n\nNão é urgente era, de certa forma, a parte mais informativa. Ela sabia distinguir urgência — havia passado uma semana calibrando o pulso de Jayce contra situações urgentes e não urgentes, e o bilhete tinha o tom das segundas.\n\nPegou a pasta de documentos que havia planejado revisar à noite. Fazia sentido combinar as coisas.\n\nEla bateu. A porta abriu.\n\nKaisa registrou três coisas em sequência rápida.\n\nPrimeiro: o quarto era pequeno, com uma cama, uma mesa, uma janela que olhava para o pátio sul — aposentos funcionais, sem decoração além do que havia sido deixado pelo ocupante anterior.\n\nSegundo: a lamparina estava acesa.\n\nTerceiro: Jayce estava nu.\n\nA nudez em si não era — ela havia visto anatomia humana em manuais médicos, havia coordenado banheiros coletivos de tropas, havia sido criada em um palácio onde os limites entre espaços privados e funcionais eram às vezes permeáveis. A nudez era uma condição factual, documentada, sem mistério conceitual.\n\nMas havia uma diferença, percebeu naquele segundo, entre saber que algo existe e ter esse algo diante de você com a distância de dois metros e a lamparina acesa entre vocês dois.\n\nEla olhou. Depois olhou para o lado. Depois olhou de volta, porque olhar para o lado havia sido um reflexo que ela não havia decidido ter e que ela não via razão de seguir sem decisão.\n\n— Isso é uma conversa de guerra? — ela perguntou.\n\n— Não — ele disse.\n\nEle não estava constrangido. Não havia nele nenhum sinal de performance ou de provocação — apenas a naturalidade específica de alguém que havia ficado nu na frente de pessoas suficientes para que isso deixasse de ser um evento. Ele estava de pé ao lado da cama com os braços levemente separados do corpo, o ombro enfaixado com o curativo que ela havia feito, olhando para ela com a mesma qualidade de atenção direta que ele usava nos mapas.\n\nKaisa ficou parada por um momento.\n\nEntão colocou a pasta de documentos na cadeira.\n\n— Me explica — ela disse.\n\nEle explicou.\n\nSem cerimônia, sem rodeios, com a objetividade de quem havia decidido que a única forma honesta de fazer aquilo era fazer direito: ela deveria saber o que é antes de qualquer coisa mais acontecer. E ele preferia que ela aprendesse primeiro a conduzir, não a receber — porque receber sem saber conduzir era como entregar o leme a alguém que ainda não conhece o mar.\n\nKaisa considerou isso.\n\nDurou o tempo suficiente para que qualquer outra pessoa interpretasse como hesitação.\n\nNão era hesitação — era o processo dela de verificar a lógica, e a lógica era sólida.\n\n— Certo — ela disse.\n\nO pau dele estava em repouso quando ela se aproximou — ela havia aprendido a palavra em manuais, havia lido sobre o mecanismo, mas o mecanismo em texto e o mecanismo diante dela eram coisas com densidades diferentes. Ele explicou com a mesma precisão com que ela havia explicado o trinco da janela: o que respondia ao toque, o que respondia ao calor, o que respondia à atenção.\n\nEla fez perguntas, porque era o que ela fazia.\n\nEle respondeu todas.\n\nQuando ela se aproximou mais — os dedos primeiro, explorando a textura, a temperatura, a mudança gradual de estado enquanto ele prestava atenção nela — ela notou o momento exato em que o ritmo da respiração dele mudou. Não dramático. Mas diferente. E diferente era informação.\n\nO pau crescendo lentamente nos seus dedos tinha, ela descobriu, uma qualidade que ela não havia antecipado: era o tipo de evidência direta e inequívoca que ela raramente encontrava em qualquer outro campo. Causa e efeito em tempo real.\n\nEla percebeu que tinha poder nisso.\n\nA respiração dela mudou antes que ela decidisse mudar.\n\nJayce disse que ela podia tirar a roupa no ritmo que quisesse.\n\nEla o fez devagar — não por intenção dramática, mas por genuína incerteza sobre o que viria depois de cada peça, e a incerteza gerava um ritmo natural de pausa e continuação. A blusa. O cinto. A saia. Quando ficou só com a roupa de baixo ela parou por um segundo, o bico do peito já marcado contra o tecido fino pela temperatura do quarto e pelo que quer que estivesse acontecendo internamente que ainda não tinha nome.\n\nEle não avançou.\n\nFicou onde estava, olhando para ela.\n\nEla percebeu que estava esperando que ela fizesse algo.\n\nTirou o que restava.\n\nFicaram um de frente para o outro — ela de pé, completamente exposta pela primeira vez diante de alguém com intenção, e o calor dela era diferente do calor do banho frio de manhã, diferente de qualquer calor que ela havia catalogado antes. Os bicos do peito rosa, sensíveis, pequenos como pétalas. A vagina já úmida de uma forma que a surpreendeu levemente — ela havia lido sobre a resposta fisiológica, mas leitura e experiência eram novamente coisas com densidades diferentes.\n\nEle disse que ela ia conduzir.\n\nEla subiu.\n\nOs primeiros movimentos eram cautelosos, analíticos — ela tentando entender o feedback em tempo real, o ângulo, a profundidade, o que o corpo dela estava dizendo em resposta a cada variação. A vagina rosada, apertada em volta do pau dele pela primeira vez, registrou cada centímetro com uma atenção que ela nunca havia dado ao próprio corpo antes. A dor era real e breve — o tipo de dor que se transforma à medida que o corpo aprende que não precisa resistir — e depois havia preenchimento, e depois pressão que ela não tinha palavra ainda para classificar adequadamente exceto que queria continuar.\n\nQuando ela perdia o ritmo, as mãos dele encontravam os quadris dela — não para corrigir com força, mas para mostrar o eixo, o equilíbrio, o ponto central de onde o movimento deveria sair. Ela ajustava. Testava. Ajustava de novo.\n\nE então encontrou.\n\nO movimento que fez ele prender a respiração era um ângulo específico que ela havia chegado por processo de eliminação, e quando encontrou ela parou.\n\nFez de novo.\n\nIsso. Era isso. Era o mecanismo do trinco funcionando na direção certa.\n\nEla aprendeu que isso era o poder que o livro de poesia havia tentado descrever e não havia conseguido porque o livro de poesia era palavras e isso era o corpo de outra pessoa respondendo ao dela.\n\nA vagina dela estava apertada em volta dele, molhada de uma forma que ela ouvia além de sentir, e quando ela encontrou o ritmo dela — não o ritmo que ela havia tentado construir analiticamente, mas o ritmo que o próprio movimento gerava quando ela parava de administrá-lo — o gemido saiu antes que ela decidisse gemê-lo.\n\nO som a surpreendeu mais do que a ele.\n\nEle ficou olhando para ela com algo nos olhos que ela classificaria depois, na calma, como satisfação do tipo específico de quem viu o momento em que alguém entende algo que não pode ser desaprendido.\n\nA onda veio do centro — da base da barriga, que ela havia sentido construindo sem nomear, que se espalhou para as coxas que fecharam involuntariamente ao redor dele, que se fechou como um punho em volta do pau dele enquanto ela tremia com as mãos no peito dele e o orgasmo a atravessava em camadas, a bucetinha apertando em pulsos rítmicos que ela sentiu de dentro para fora.\n\nEla ficou imóvel depois, respirando.\n\nEle não havia gozado. Ela percebeu isso sem perguntar.\n\n— Por que não? — ela perguntou, quando a respiração voltou.\n\n— A noite não acabou — ele disse.\n\nA segunda vez ele conduziu.\n\nA virou de costas — o colchão debaixo dela, os cabelos prata espalhados no travesseiro, os braços levantados e segurados por uma mão dele enquanto a outra encontrava os pontos que ela nem sabia que tinha. O pau voltando a entrar nela com o ritmo que ele escolheu — lento primeiro, o tipo de lento que não era hesitação mas controle puro, cada impulso fundo o suficiente para que ela sentisse os limites do próprio corpo se redefinindo.\n\nDepois mais rápido, quando ele decidiu.\n\nEla gemeu sem parar — os bicos do peito duros e hipersensíveis a cada vez que o peitoral dele os roçava, as coxas abertas ao máximo, a bucetinha apertando cada vez que ele ia fundo. Ele mordeu o pescoço dela com precisão cirúrgica — um ponto exato abaixo do maxilar — e ela arqueou com a força de um reflexo involuntário, o arco da coluna levantando os quadris contra ele.\n\nQuando ele foi — o orgasmo dele chegou com um som baixo e único que ela ouviu junto com o calor espalhando dentro dela, a gozada pesada e quente preenchendo a buceta dela enquanto ele a segurava pelo quadril com força precisa — ela estava no meio do segundo orgasmo, e os dois chegaram juntos no mesmo momento, e ela entendeu que havia coisas que os manuais descreviam como fisiologia e que eram, na prática, uma categoria inteiramente diferente de experiência.\n\nEla ficou deitada no lado dele com a cabeça no ombro — o ombro enfaixado, ela cuidou de não pressionar o curativo.\n\nA lamparina estava quase no fim do óleo. Daqui a vinte minutos apagaria sozinha.\n\nKaisa ficou olhando para o teto.\n\nPensou no caderno que tinha deixado no escritório.\n\nPensou no livro de poesia.\n\nPensou que o milímetro entre a pele e a pele era uma descrição inadequada do que havia acontecido, mas que o autor provavelmente havia feito o melhor com as ferramentas disponíveis.\n\nEla ia ter que revisar várias entradas.\n\n— Doran me perguntou se eu já fui com alguém — ela disse, eventualmente.\n\n— Quem é Doran?\n\n— O guarda do corredor leste. Eu disse que não havia saído do palácio esta semana.\n\nUm segundo de silêncio.\n\nDepois Jayce riu — um som baixo e real, com o peito, o tipo de riso que não era educado. Ela ficou ouvindo com a cabeça no ombro dele e achou que o som tinha uma textura interessante.\n\nA lamparina apagou.\n\nNo escuro, Kaisa pensou que ia precisar de um caderno novo."}]},{"id":"n934b75be-f8c8-4c19-8549-42ee34ae55c1","title":"ATO 2 — O JOGO DE ESPELHOS","chapters":[{"id":"n54faac6c-4c7e-4019-8afc-2c28c322c921","title":"Capítulo 1: Pequenos Hábitos","text":"Havia uma geometria específica no jeito que Jayce passava pelo setor de administração.\n\nAurora havia notado na primeira vez sem nomear — um guerreiro sênior não tinha razão funcional de fazer aquela curva particular no corredor leste a não ser que a rota alternativa fosse, por algum critério que ela não conseguia identificar, superior à rota direta. Era mais longa. Passava por dois lances de escada. A única coisa que a rota direta não oferecia era a janela do escritório de Kaisa.\n\nAurora notou. Arquivou. Continuou o café.\n\nNa segunda vez, três dias depois, ela estava no corredor quando Jayce passou. Ele não entrou no escritório — apenas passou, com a cadência regular de alguém indo de um lugar a outro, sem olhar de forma óbvia para dentro. Mas ele havia diminuído o passo por um segundo no ponto certo. Aurora havia cronometrado mentalmente.\n\nNa terceira vez, ela começou a tomar notas internas.\n\nOs sinais eram pequenos e por isso mais legíveis — eram do tipo que as pessoas deixam quando acreditam que não estão deixando nada. Aurora havia desenvolvido, ao longo de anos de diplomatia e de um casamento com um homem que processava a maioria das coisas em silêncio, uma sensibilidade específica para as mensagens que as pessoas transmitem sem decidir transmitir.\n\nA xícara de ervas.\n\nHavia uma mistura específica — menta com raiz de cardamomo e uma folha seca que Aurora não havia conseguido identificar visualmente, porque nunca havia visto aquela combinação em nenhum outro lugar do palácio. Jayce a tinha toda manhã, no mesmo horário, num copo que chegava antes que ele pedisse. Aurora havia verificado: os outros membros do staff pediam ao serviço de bebidas com pelo menos quinze minutos de antecedência. O copo de Jayce aparecia sem pedido.\n\nEla havia perguntado, casualmente, ao assistente de turno.\n\n— A senhorita Kaisa prepara — o assistente havia dito, com o tom de quem está relatando algo óbvio. — Ela sabe que ele prefere sem açúcar e com a menta mais curta que o padrão.\n\nAurora havia agradecido sem expressão e havia ido embora calculando.\n\nEla sabe que ele prefere.\n\nEm reuniões — ela havia observado três, a pretexto de interesse diplomático legítimo — Jayce e Kaisa nunca sentavam lado a lado. Isso em si não era incomum; havia razões protocolares para a disposição dos assentos em reuniões formais. O que era incomum era o ângulo.\n\nEles se sentavam em diagonal — o tipo de diagonal que, se você traçasse uma linha imaginária entre os dois, cruzava o centro da mesa sem chamar atenção de ninguém que não estivesse procurando. Do ângulo em que ela se sentava, Aurora podia ver os dois simultaneamente. Havia um momento específico, quando alguém externo falava e a atenção geral estava desviada, em que os olhares se cruzavam por menos de um segundo e depois voltavam para a frente.\n\nCoordenados, mas sem parecer coordenados.\n\nAurora havia feito anotações sobre o ângulo de cruzamento dos olhares.\n\nEra o mesmo ângulo todas as vezes.\n\n— Você está diferente — Aurora disse.\n\nEstavam na enfermaria, verificando estoques de remédio. Era uma tarde de quarta-feira sem agenda específica, o tipo de tarde que Aurora usava para observar o palácio sem aparecer como se estivesse observando o palácio. Kaisa contava frascos com a mesma precisão com que fazia tudo — a caligrafia nos rótulos verificada contra a lista, os números anotados com a letra firme e regular.\n\n— Estou com o mesmo peso — Kaisa respondeu, sem levantar o olhar.\n\n— Não era isso.\n\nSilêncio. O lápis de Kaisa continuou se movendo.\n\nAurora esperou. Ela era muito boa em esperar — havia aprendido que silêncio era uma ferramenta e que a maioria das pessoas o preenchia antes de precisar.\n\nKaisa não preencheu. Contou frascos.\n\n— Aconteceu alguma coisa? — Aurora perguntou, depois de tempo suficiente.\n\n— Não.\n\nO lápis não havia hesitado.\n\nAurora inclinou levemente a cabeça — as orelhas fazendo o mesmo movimento que ela sempre tentava controlar em situações que exigiam expressão neutra e que insistiam em antecipar o rosto. Não era a negativa que era informativa. Era o não de quem havia ensaiado a resposta antes de precisar dela — o ritmo errado para uma pergunta que deveria ser sem consequência.\n\nEla não insistiu.\n\nGuardou a pergunta no lugar onde guardava as ferramentas que funcionam melhor de outra forma.\n\nÀ noite, no quarto de hóspede com a cauda enrolada ao redor dos tornozelos porque ela fazia isso quando estava pensando e havia desistido de tentar não fazer, Aurora revisou o mapa mental do que havia coletado.\n\nA geometria do corredor. A xícara sem pedido. O ângulo diagonal em reunião. A negativa com o ritmo errado. A forma que Kaisa havia parado de se mover de uma maneira e havia começado a se mover de outra — sutil, mas Aurora media distâncias em escalas pequenas.\n\nEram dados. Eram suficientes para uma conclusão provisória.\n\nA questão não era o que havia acontecido — sobre isso ela tinha uma teoria bastante sólida. A questão era o que fazer com o que tinha.\n\nAurora era, fundamentalmente, uma pessoa curiosa. A curiosidade dela não era do tipo difuso que se satisfaz com a resposta — era do tipo preciso que quer entender o mecanismo, cada peça, cada sequência. Queria saber o que Kaisa havia aprendido e como havia aprendido e o que aquilo havia feito com ela.\n\nA curiosidade era um instrumento. Ela sabia disso. E instrumentos de precisão eram para ser usados.\n\nEla apagou a lamparina.\n\nFicou pensando no escuro com a cauda ainda enrolada nos tornozelos, e o plano que estava formando tinha a consistência das coisas que chegam devagar, peça por peça, cada uma encaixando antes de revelar a seguinte."},{"id":"n6bb1d33e-d1f0-40ba-8b26-720aaae74d30","title":"Capítulo 2: O Vídeo","text":"Dezoito dias depois da batalha, o corredor leste estava quieto às dez da noite.\n\nKaisa havia aprendido isso sem planejar aprender — havia incorporado o ritmo do palácio noturno como incorporava qualquer informação útil, pela repetição e pela observação. Sabia quais portas tinham a dobradiça levemente rígida e quando o guarda do turno fazia a ronda do segundo andar. Sabia que o quarto 14 ficava fora da rota da ronda por quatro minutos específicos entre dez e doze e dez e dezesseis.\n\nNão havia planejado. Havia apenas notado.\n\nEla bateu três vezes na porta do quarto 14.\n\nDesta vez não havia bilhete. Ela havia vindo porque queria vir, que era uma categoria de razão que ela estava começando a reconhecer como válida mesmo sem referência externa.\n\nA porta abriu.\n\nEla entrou sem hesitar — deixou a roupa cair sem esperar instrução, os cabelos prata soltos porque havia desfeito o coque de trabalho ainda no escritório, antes de vir, o que era um dado que ela não havia analisado explicitamente mas que Jayce notou pelo jeito que ficou olhando para ela.\n\nEle estava de pé ao lado da janela, sem camisa, o curativo já menor do que havia sido — a ferida fechando na velocidade de alguém que havia passado a vida inteira regenerando tecido sob pressão. Os ombros estavam à luz da lamparina, e a lamparina estava do mesmo lado que antes.\n\nO olhar dele era o mesmo de professor que ficou satisfeito com o progresso, mas havia nele agora uma camada diferente — o reconhecimento de que o que estava na frente dele não era mais exatamente a mesma coisa que havia sido duas semanas antes.\n\n— Você veio por vontade própria — ele disse.\n\n— Sim — ela disse.\n\nNenhuma questão de logística. Nenhuma pasta de documentos na cadeira.\n\nEla subiu sem ser convidada — era o jeito dela agora, a confiança que ela havia adquirido pelo processo simples de ter aprendido como o próprio corpo funcionava e de ter descoberto que o conhecimento não desaparecia. As mãos nos ombros dele, os joelhos nos lados dos quadris dele, o pau dela dentro e ela ajustando o ângulo com a memória específica de onde estava o ponto que mudava a respiração dele.\n\nEla o encontrou mais rápido desta vez.\n\nConduziu com intenção — variando o ritmo de forma deliberada, testando as bordas do que havia aprendido, descobrindo que havia diferença entre fazer porque foi ensinada e fazer porque estava escolhendo. O prazer tinha uma qualidade diferente quando era a decisão dela. Era mais focado. Mais direto. A vagina dela molhada ao redor do pau dele, apertando cada vez que ela mudava o ângulo, e ela ouvia o som disso com a atenção de quem está aprendendo uma língua nova e começa a reconhecer os padrões.\n\nJayce ficou com as mãos nos quadris dela, não para guiar — apenas para sentir.\n\nQuando ela desacelerou, ele inverteu.\n\nA pegou pelos quadris e a virou com a precisão de quem sabe onde vai colocar cada coisa antes de colocar. De costas, os joelhos dela no ombro dele — o ombro curado, não o enfaixado, ela verificou automaticamente — e a posição abria um ângulo que ela não havia experenciado antes, mais fundo, mais direto, cada impulso dele atingindo um ponto interno que ela havia lido sobre e que a leitura havia descrito de forma completamente insuficiente.\n\nEla gemeu alto.\n\nSem cerimônia. Sem filtro. O som preencheu o quarto com a naturalidade das coisas que saem quando o corpo para de pedir permissão.\n\nA mão de Jayce cobriu a boca dela — uma vez, leve, como teste. Ela mordeu a palma sem decidir morder, os dentes fechando com a força de um reflexo que saiu de algum lugar mais fundo que a consciência.\n\nEle parou.\n\nA olhou.\n\nHavia algo nos olhos violeta que ela não havia visto antes — um reconhecimento, o tipo que se forma quando alguém que você estava ensinando faz alguma coisa que você não havia antecipado. O sorriso que se formou no canto da boca dele foi pequeno e involuntário e real.\n\n— Aí está — ele disse, muito baixo.\n\nContinuou.\n\nO corredor do lado de fora do quarto 14 estava quieto às dez e onze da noite.\n\nAurora havia passado por ele a caminho do banheiro do fim do corredor — uma rota perfeitamente legítima, um trajeto que ela havia feito três vezes naquela semana e que não exigia justificativa. As lâmparinas do corredor estavam a dois terços de intensidade — a configuração noturna padrão do palácio, que criava mais sombra do que luz nos ângulos oblíquos.\n\nA porta do quarto 14 estava levemente desencaixada.\n\nNão aberta — o tipo de desencaixe que acontece quando uma dobradiça tem folga de um milímetro e a porta não fecha no clique final, que é comum em cômodos antigos com madeira que se contrai no frio. Aurora havia notado a dobradiça na primeira semana. Era o tipo de coisa que ela notava.\n\nEla foi parar na frente da porta sem decidir parar.\n\nA fresta era de dois centímetros.\n\nA lamparina lá dentro criava um cone de luz que, pelo ângulo da fresta, iluminava exatamente o centro do cômodo.\n\nAurora ficou olhando por um segundo.\n\nDepois ficou olhando por mais tempo.\n\nO cristal no pescoço dela era azul-escuro, do tamanho de uma amêndoa, preso num fio de prata que ela havia ganhado de Kayn no primeiro mês de casamento. Kayn havia dito que era um amuleto de proteção — o que era verdade, mas era uma verdade incompleta. O cristal também tinha função de registro passivo, ativado pelo contato das pontas dos dedos com a pedra durante um estado de atenção elevada.\n\nAurora não havia ativado intencionalmente.\n\nEla havia ficado na fresta da porta com os olhos no que estava acontecendo lá dentro — Kaisa de costas com os joelhos no ombro de Jayce, o pau dele fundo dentro dela a cada impulso, o som dos gemidos dela escapando pelo corredor quieto — e as pontas dos dedos haviam encontrado o cristal no pescoço num movimento que não foi decidido, foi reflexo, foi o tipo de movimento que o corpo faz quando está registrando algo que a mente ainda não processou.\n\nO cristal aqueceu.\n\nOnze minutos e quarenta e dois segundos de registro, soube depois, quando verificou.\n\nEla foi embora do corredor com os joelhos levemente instáveis.\n\nNão era culpa — Aurora havia feito suficientes coisas deliberadas na vida para reconhecer a diferença entre aquelas e as acidentais. Era outra coisa: a sensação específica de ter visto algo que não estava planejado ver e de ter ficado quando poderia ter ido, e de não saber ainda se a segunda coisa havia sido erro ou escolha.\n\nNo quarto dela, com a lamparina acesa, ela retirou o cristal e o colocou na mesa.\n\nOlhou para ele.\n\nOnze minutos e quarenta e dois segundos.\n\nO que ela tinha nas mãos era, por qualquer análise objetiva, uma ferramenta. O que fizesse com a ferramenta era uma decisão separada, com consequências separadas, que ela poderia tomar com calma e com o tipo de consideração que as situações delicadas exigiam.\n\nA cauda de Aurora balançou de um jeito que ela não tentou controlar porque estava sozinha.\n\nEla pensou em Kaisa — a expressão de Kaisa ao receber a nota de protocolo errada, a forma que ela havia respondido sobre a dobradiça da janela, o não de ritmo errado quando Aurora havia perguntado se algo havia acontecido.\n\nEla pensou no que queria saber.\n\nDepois pensou em como perguntar de um jeito que garantisse a resposta.\n\nDois dias depois, Aurora entrou na biblioteca às duas da tarde.\n\nKaisa estava sozinha — o horário de almoço havia esvaziado os outros setores e a biblioteca ficava quieta nessa hora, que era provavelmente a razão pela qual Kaisa havia escolhido trabalhar ali nesse horário. Aurora havia notado o padrão.\n\nEla colocou o cristal na mesa entre as duas.\n\nSem explicação. Sem preâmbulo. Apenas o cristal azul-escuro na mesa de carvalho, entre o caderno de Kaisa e a xícara de café que estava esfriando.\n\nKaisa olhou para ele.\n\nHavia, na expressão dela, o processo visível de reconhecimento — não do objeto, que ela provavelmente não havia visto antes de perto, mas do que o objeto representava. Kaisa era boa em lógica, e a lógica de um amuleto colocado na mesa sem explicação depois de onze dias tinha uma direção bastante clara.\n\nO silêncio durou o tempo exato de uma avaliação.\n\n— Você vai me dizer o que eu quero saber — Aurora disse. A voz estava mansa — o tipo de mansidão que não é suavidade, é controle. A orelha direita inclinou dois centímetros para frente sem permissão.\n\nKaisa olhou para o cristal. Olhou para Aurora. Processou.\n\n— O que você quer saber?\n\n— Tudo. — Uma pausa de um segundo. — Ou eu mostro isso pra quem você menos quer.\n\nO silêncio desta vez era diferente do anterior — tinha peso, tinha direção, tinha a textura das coisas que não se desfazem por conta própria. Kaisa ficou olhando para o cristal com os olhos violeta escuros sem expressão legível, e Aurora, que havia aprendido a ler Kaisa nos pequenos sinais, viu o momento em que ela terminou de calcular as variáveis.\n\nMuito lentamente, Kaisa fechou o livro que estava segurando.\n\n— O que você quer? — ela perguntou.\n\nNão o que você quer saber. O que você quer. A distinção era pequena e era inteira.\n\nAurora ficou olhando para ela por um momento.\n\nAh, pensou, com a clareza específica de quem recalibra uma suposição a tempo. Você não é mais a mesma garota do corredor.\n\nO sorriso que se formou era pequeno — o sorriso que chegava quando ela encontrava algo mais interessante do que havia esperado.\n\n— Um dia — Aurora disse. — Fora do palácio. Você e eu. Sem protocolo.\n\n— E o cristal?\n\n— Fica comigo até o fim do dia. Devolvo depois.\n\nKaisa considerou isso com a seriedade com que considerava qualquer proposta de logística.\n\n— Tudo bem — ela disse."},{"id":"n3b3d8b48-dd71-48af-8a23-886724b41d79","title":"Capítulo 3: Um Dia Só Nosso","text":"O mercado da cidade baixa cheirava a especiaria velha e a couro e ao tipo de peixe que havia sido peixe há suficiente tempo para ter desenvolvido uma opinião própria sobre o assunto.\n\nKaisa o havia visitado quatro vezes em cinco anos — sempre em função de trabalho, sempre com uma lista de itens específicos a verificar, sempre de saída antes que o movimento da tarde tornasse a navegação logisticamente ineficiente. Ela conhecia o mercado de relatório, não de experiência, e havia uma diferença entre os dois que ela havia começado a notar, ultimamente, em mais de um campo.\n\nAurora caminhou pelo mercado como se o mercado fosse um lugar que existia especificamente para ser explorado por ela.\n\n— Aqui — ela disse, parando numa barraca de temperos com a mesma decisão com que tomava todas as decisões. As orelhas estavam para frente — o ângulo de exploração, Kaisa havia aprendido. — Você já provou esse?\n\nO pimentão era escuro, quase roxo, levemente enrugado na casca, pendurado em fio junto com outros da mesma variedade. O vendedor — sessenta e tantos anos, dentes faltando no lado direito, o tipo de pessoa que havia vendido pimentões por tempo suficiente para ter opiniões definitivas sobre eles — observou Aurora com a expressão de quem reconhece uma compradora séria.\n\n— Defumado na lenha — ele disse. — Doce por fora, fogo por dentro.\n\n— Perfeito — Aurora disse, e comprou dois.\n\nEla deu um para Kaisa.\n\nKaisa o examinou com a atenção que dava a dados novos.\n\n— Qual é a escala de intensidade? — ela perguntou, para o vendedor.\n\n— Dois pimentões da esquerda, dez do direito — ele disse, indicando a fila com o polegar.\n\nKaisa olhou para o pimentão na mão. Olhou para a posição na fila, que estava em seis.\n\n— Seis é médio — ela disse.\n\n— Médio pra quem come muito — o vendedor disse, com a satisfação contida de quem deu um aviso.\n\nKaisa mordeu.\n\nO que se seguiu foi uma sequência de aproximadamente três segundos durante a qual ela processou o fogo com a expressão de alguém tentando categorizar uma experiência sem referência, seguida por um engasgo que não foi dramático mas foi definitivamente real, seguida por uma tosse que fez o vendedor e os dois clientes da barraca ao lado olharem.\n\nAurora riu do tipo de riso que faz as orelhas recuarem completamente de prazer.\n\n— Você estava avisada — ela disse, estendendo o cantil de água que havia comprado na entrada do mercado por razões que agora faziam sentido retroativamente.\n\nKaisa bebeu. Enxugou os olhos. Olhou para o pimentão restante na mão com a expressão de quem está reconsiderando uma série de escolhas.\n\n— O relatório de importação diz que esses pimentões têm demanda alta — ela disse, com a voz levemente rouca. — Agora entendo por quê.\n\n— Você anotou os pimentões?\n\n— Sempre anoto itens de alta demanda. É logística.\n\nAurora ficou olhando para ela por um segundo com uma expressão que Kaisa não conseguiu classificar imediatamente e que mais tarde categorizaria como ternura disfarçada de incredulidade.\n\n— Vem — Aurora disse, e caminhou para a próxima barraca.\n\nElas passaram a tarde assim.\n\nAurora comprava coisas que não precisava e as experimentava com o entusiasmo de quem coleciona experiências em vez de objetos. Kaisa observava e às vezes participava — com mais cautela depois do pimentão, mas com a curiosidade que ela aplicava a tudo. Um doce de mel com especiaria que Aurora disse ser do leste e que tinha uma doçura que Kaisa achou excessiva mas reconheceu como precisa para a receita. Um tecido bordado que Aurora segurou contra o braço de Kaisa por um momento para verificar se a cor funcionava — um gesto prático que deixou Kaisa com a sensação do toque ainda no antebraço por um tempo depois.\n\nElas conversaram.\n\nNão sobre o palácio. Não sobre diplomatia ou logística ou qualquer coisa que cabia em relatório. Aurora contava histórias sobre lugares onde havia estado — uma cidade costeira onde o mercado funcionava em barcos, não em terra, e você comprava frutas de alguém numa canoa. Uma floresta no norte onde as árvores tinham folhagem bioluminescente de madrugada e os guias locais cobravam o dobro para mostrar de noite porque ninguém queria a versão de dia. Uma negociação que havia corrido terrivelmente mal porque o intérprete havia confundido dois termos com pronúncia similar e o que deveria ser tratado comercial havia se tornado tratado de arrendamento de gado.\n\nKaisa descobriu, ao longo da tarde, que Aurora era mais séria do que o comportamento dela sugeria.\n\nNão séria no sentido de formal ou grave — séria no sentido de que quando ela falava sobre algo que importava de verdade, a ironia saía e ficava o pensamento direto, sem ornamento. Era o jeito que ela havia descrito a negociação com o gado — primeiro o humor, depois, sem aviso, um comentário sobre o custo humano de interpretação inadequada em contextos de tensão que mostrava que ela havia pensado no assunto de verdade. E depois o humor de volta, como se a seriedade fosse algo que ela protegia mostrando-a de relance e depois cobrindo.\n\nKaisa havia anotado isso mentalmente.\n\nO mercado fechou às seis. Elas foram embora com as mãos levemente sujas de especiaria e o ritmo de caminhada de pessoas que estiveram juntas tempo suficiente para sincronizar o passo sem perceber.\n\nNo quarto de Aurora, a lamparina estava no ponto de meia intensidade — a configuração dela para quando estava pensando, Kaisa havia notado — e havia uma chaleira pequena sobre o suporte aquecedor no canto.\n\nAurora fez algo quente para beber. A bebida cheirava a ervas que Kaisa não reconhecia inteiramente e a algo leve e adocicado que funcionava como fundo. Os dois copos ficaram na mesa — Aurora sentada de frente para ela com os óculos levemente descidos no nariz, a expressão do modo observação.\n\nA conversa havia desacelerado.\n\nEra o tipo de desaceleração que acontece quando as palavras fáceis acabaram e o que resta é o que as palavras fáceis estavam cobrindo.\n\n— Você gostou? — Aurora perguntou.\n\n— Do dia? — Kaisa disse.\n\n— Do que vi no corredor.\n\nO silêncio chegou sem drama. Kaisa ficou com ele. Havia aprendido, nas últimas semanas, que silêncio não era automaticamente um problema a ser resolvido.\n\nAurora esperou. Ela era muito boa em esperar.\n\n— Sim — Kaisa disse, por fim.\n\nA palavra tinha o peso de algo que ela havia considerado honestamente antes de dizer, que era o único jeito que ela sabia dizer coisas.\n\nAurora tirou os óculos.\n\nFoi um gesto pequeno e prático — ela os colocou na mesinha sem olhar, com o automatismo de quem faz aquilo centenas de vezes. Depois se levantou do lugar onde estava e veio sentar ao lado de Kaisa na beira da cama, e quando estava sentada ela colocou a mão no queixo de Kaisa e virou o rosto — gentil, com pressão mínima, mas sem pedir permissão.\n\nO beijo chegou devagar primeiro.\n\nTeste, leitura, avaliação — o beijo de alguém que aprende o outro antes de avançar. Depois Aurora sentiu que Kaisa estava respondendo e a impaciência natural dela entrou: o beijo mudou de caráter, ficou mais direto, a boca de Aurora cobrindo a de Kaisa com a pressão de quem parou de testar e começou a querer.\n\nDiferente de Jayce.\n\nNão havia estrutura nisso — não havia pedagogia, não havia sequência planejada. Era intuição, era atenção distribuída de forma diferente, era o tipo de condução que funciona por feedback e não por plano. Aurora tocava onde sentia que ia fazer diferença e retirava quando o feedback mudava. Era uma conversa, não uma instrução.\n\nAs orelhas de Aurora traíram-na num determinado ponto — se moveram para frente com o ângulo da excitação que ela havia parado de tentar controlar. Ela o notou, optou por não se importar, e continuou.\n\nOs óculos foram para a mesinha em algum momento que nenhuma delas registrou com precisão.\n\nKaisa ficou de costas — não pela mesma razão que com Jayce, não por instrução, mas porque Aurora havia pressionado levemente os ombros dela nessa direção e ela havia ido, que era a diferença entre seguir uma rota conhecida e descobrir que a rota nova chegava no mesmo lugar por caminho diferente.\n\nAurora desceu.\n\nA boca no pescoço de Kaisa, depois na clavícula, depois na curva do ombro — cada ponto escolhido por intuição, verificado pelo feedback da respiração de Kaisa, mantido o tempo exato para fazer diferença. Quando chegou nos bicos do peito ela parou — não por dúvida, por intenção. A língua no bico esquerdo, lenta, o tipo de lento que é atenção total dirigida a um ponto específico, e Kaisa prendeu a respiração de uma forma que Aurora claramente havia esperado porque não mudou o que estava fazendo.\n\nContinuou. O bico entre os lábios, a pressão suave, depois menos suave.\n\nKaisa emitiu um som que não era um gemido completo mas era o antecedente do gemido, e Aurora ficou satisfeita com o antecedente e desceu mais.\n\nA língua dela encontrou a bucetinha de Kaisa com precisão que não era acidental — havia nela a atenção específica de alguém que estava aprendendo o outro por toque, mapeando resposta por resposta. Primeiro devagar, longitudinal, aprendendo o território. Depois pontual — o ponto exato onde a respiração de Kaisa mudava de ritmo, onde os quadris dela faziam um movimento involuntário de meio centímetro para frente.\n\nEsse ponto. Esse ritmo.\n\nAurora o memorizou e fez a mesma coisa mais rápido, e mais rápido, e a mão de Kaisa encontrou os cachos ruivos de Aurora sem decisão — os dedos enroscados no cabelo, segurando sem puxar, depois puxando levemente quando Aurora aumentou o ritmo mais uma vez.\n\nO orgasmo de Kaisa foi diferente.\n\nEra mais espalhado do que com Jayce — não um ponto de pressão acumulando e liberando, mas uma onda que começou na superfície e foi para dentro, que durou mais, que a deixou com as coxas apertadas nos dois lados da cabeça de Aurora por um tempo longo o suficiente para que ela soubesse que havia durado. Ela tremia quando terminou, as mãos ainda nos cabelos de Aurora, e Aurora continuou até Kaisa puxar o cabelo dela de verdade.\n\nAurora subiu.\n\nAs duas ficaram de frente uma para a outra, Kaisa com o peito subindo e descendo, a pele aquecida e levemente ruborizada do pescoço até as bochechas.\n\nAurora tinha uma expressão que Kaisa ainda estava aprendendo a ler — satisfeita, e curiosa, e havia nela algo que era mais pessoal do que técnico, o tipo de olhar que não é de avaliação mas de presença.\n\n— Minha vez — Kaisa disse.\n\nA voz estava levemente diferente — mais baixa, mais direta. Sem hesitação e sem pedido de instrução.\n\nAurora ficou olhando para ela por um segundo.\n\n— Certo — disse ela, com o mesmo sorriso pequeno de quem encontrou algo mais interessante do que havia esperado.\n\nKaisa descobriu, nos minutos seguintes, que Aurora era completamente diferente de Jayce de mais de uma forma.\n\nOnde Jayce ficava quieto e contido, Aurora fazia sons — pequenos, involuntários, o tipo que escapa quando o corpo para de gerenciar a imagem que está dando. As orelhas eram impossíveis de ignorar como indicadores: cada vez que Kaisa encontrava algo que funcionava, elas avançavam dois centímetros e a cauda parava de balançar, que Kaisa havia aprendido a reconhecer como o equivalente a prender a respiração.\n\nEla aprendeu Aurora com a mesma atenção com que havia aprendido tudo que aprendeu nos últimos dezoito dias: pelo feedback direto, pela observação dos pequenos sinais, pela disposição de ajustar e tentar de novo.\n\nQuando a língua de Kaisa encontrou a base das orelhas de Aurora — por acaso, no começo, investigando o limite entre o pescoço e o couro cabeludo — Aurora fez um som que era completamente diferente de qualquer coisa que ela havia feito antes. Um som curto e involuntário e bastante revelador.\n\nKaisa parou.\n\nFez de novo, com intenção.\n\nAurora agarrou o ombro dela.\n\nA cauda estava completamente imóvel.\n\nEsse ponto. Kaisa memorizou e continuou.\n\nO orgasmo de Aurora veio com a voz levemente rouca — o timbre baixo que ela havia notado e que agora entendia — e com as unhas nos ombros de Kaisa e com o nome de ninguém nos lábios, só o som, só a respiração, só o corpo de Aurora tomando tempo suficiente para que Kaisa soubesse que havia sido completo.\n\nElas ficaram deitadas depois por um tempo que nenhuma delas mediu.\n\nO quarto cheirava a ervas da bebida esquecida e à lamparina meia intensidade e ao tipo de calor específico que dois corpos criam num espaço pequeno.\n\nO amuleto ainda estava na mesa de Aurora.\n\nEntre os dois copos esquecidos, a pedra azul-escura com a lamparina refletindo na superfície.\n\nNenhuma das duas mencionou."},{"id":"nf910f59a-b5c4-4c66-b813-fef9fa98d18a","title":"Capítulo 4: O Marido que Não Pergunta","text":"O som dos passos de Kayn no corredor tinha uma cadência específica.\n\nAurora o havia memorizado no primeiro mês — não conscientemente, da mesma forma que se memorizam as vozes de pessoas próximas sem decidir memorizar, pelo acúmulo de repetição. Era mais pesado do lado direito, porque ele tinha uma velha fratura no quadril esquerdo que havia calcificado ligeiramente errado e que ele nunca havia feito tratar porque dizia que não incomodava, o que Aurora sabia ser parcialmente mentira e havia decidido respeitar porque algumas mentiras são a forma que as pessoas têm de carregar as próprias histórias.\n\nEla ouviu os passos no corredor.\n\nAbriu a porta antes que ele batesse.\n\nKayn era do tipo de pessoa que preenchia o espaço não por intenção mas por física — a largura dos ombros, a densidade do ar ao redor dele quando estava em movimento, o jeito que os olhos âmbar varriam o ambiente antes que o corpo houvesse terminado de entrar. Ele carregava dois dias de viagem de volta nele — a poeira nas botas, o cabelo solto da trança pela metade, uma marca no pescoço que podia ser de armadura ou de sol e que Aurora não examinou de perto.\n\nEle a olhou da cabeça aos pés.\n\nEra o olhar de chegada — o inventário de como você está de verdade, que ele havia aprendido a fazer sem palavras e que ela havia aprendido a reconhecer como a forma dele de dizer que havia sentido falta. Não havia linguagem de sentir falta no vocabulário que eles usavam entre si; havia esse olhar, e havia o movimento que veio depois.\n\nEle foi direto para onde ela estava.\n\nO beijo era do jeito deles — pesado e sem cerimônia, a mão grande na nuca dela e a outra no quadril, o tipo de beijo que não pede licença porque não precisa. A cauda de Aurora bateu uma vez no ar involuntariamente. Ele a levantou sem aviso, os braços ao redor da cintura dela com a facilidade de quem levantou o mesmo peso centenas de vezes, e ela enrolou as pernas ao redor da cintura dele e deixou ser carregada porque era o jeito deles e o jeito deles funcionava.\n\nA cama estava a três metros.\n\nEle percorreu os três metros sem mudar o beijo.\n\nOs dois lados da cama.\n\nAurora de costas, Kayn sobre ela — a diferença de tamanho entre eles era parte da linguagem que haviam construído, a presença dele sobre ela tinha uma qualidade de peso e calor que ela não havia encontrado de outra forma. Ele a conhecia — conhecia os pontos, os ritmos, o que fazer com a base das orelhas sem que ela precisasse dizer, que era uma forma de intimidade que levava tempo.\n\nQuando ele entrou, entrou com o ritmo dele: lento, deliberado, o primeiro impulso profundo o suficiente para que ela adaptasse o ângulo dos quadris automaticamente. Eles haviam aprendido isso. O corpo de Aurora sabia o que era o corpo de Kayn e havia deixado de precisar de tempo de ajuste.\n\nEla arqueou.\n\nAs mãos ao redor do pescoço dele, os quadris encontrando os impulsos dele com a memória de meses — eles se moviam como uma argumentação que ambos conheciam de cor, cada movimento uma resposta ao anterior, o ritmo construindo com a lógica das coisas que foram praticadas até virarem fluência.\n\nO momento aconteceu quando ele aprofundou o ângulo.\n\nFoi uma fração de segundo — uma pausa no ritmo que durou menos que um batimento, a diferença imperceptível entre um impulso e o seguinte, mas que Aurora sentiu porque estava prestando atenção e porque conhecia o corpo dele tão bem quanto o dela. Os olhos âmbar piscaram para ela uma vez.\n\nKayn sabia.\n\nNão havia palavra para isso. Não havia pergunta. Havia o olhar de um segundo e o reconhecimento mútuo do reconhecimento, e então o ritmo voltou — exatamente o mesmo, exatamente a mesma pressão e profundidade, porque Kayn não era o tipo de homem que pausava para processar quando havia processado o suficiente.\n\nAurora encontrou os impulsos dele como se nada houvesse acontecido.\n\nPorque nada havia acontecido. Porque o que ela havia sentido com Kaisa e o que estava sentindo agora eram coisas que existiam no mesmo espaço dela sem cancelar uma à outra, como duas cores no mesmo tecido — visíveis separadamente, mas o tecido era um só.\n\nKayn foi fundo até ela gemer.\n\nO orgasmo dela foi genuíno — o nome dele nos lábios dela, porque o nome dele era real, porque o marido fundo dentro dela era real, porque o que havia acontecido com Kaisa era real e nenhuma das duas realidades apagava a outra. Ela gozou com a cauda varrendo o lençol e as unhas no ombro dele e o som que saía sem filtro porque com Kayn ela havia deixado de ter filtro há tempo suficiente para não lembrar de ter tido.\n\nEle foi junto.\n\nO som que ele fez era o único som que ele fazia quando não conseguia mais segurar — baixo, contido, de dentro do peito. Ela o conhecia como conhecia o passo dele no corredor.\n\nDepois.\n\nKayn com a mão pesada na cintura de Aurora, os olhos fechados com a velocidade dos que dormem cedo porque acordam antes do sol. Ele estava dormindo em menos de quatro minutos.\n\nAurora ficou acordada.\n\nO teto do quarto deles estava levemente descascando num canto — ela havia notado há seis semanas e havia colocado na lista de manutenção, que Kaisa havia executado dois dias depois. O trabalho estava feito mas havia ficado uma marca de onde o reboco novo se encontrava com o velho, uma linha que ela viu mesmo com a lamparina apagada porque a janela deixava entrar luz suficiente para os contornos.\n\nEla ficou olhando para a linha.\n\nO que Kayn havia sentido, ela sabia. A diferença que ele havia percebido no corpo dela, ela sabia o que era. E ela havia esperado que ele dissesse algo — não porque esperasse confronto, mas porque Kayn, nas raras vezes em que dizia alguma coisa direta, dizia coisas que eram difíceis de ignorar depois.\n\nEle não havia dito nada.\n\nHavia continuado.\n\nAurora ficou com isso por um tempo — o não-dizer dele, o seu próprio não-dizer, a camada que estava por baixo do silêncio de ambos.\n\nHavia coisas que eles faziam sem combinar. Havia um acordo que nunca havia sido dito em voz alta e que ambos haviam seguido, intuitivamente, sem verificar se o outro também estava seguindo. E agora havia informação nova — informação que o corpo de Aurora havia dado ao corpo de Kayn sem que a mente de nenhum dos dois houvesse tomado decisão.\n\nA mão de Kayn na cintura dela era pesada e quente.\n\nAurora colocou a mão sobre a dele.\n\nEventualmente, ela pensou, vamos precisar falar.\n\nNão hoje à noite.\n\nA lamparina estava apagada e a linha no teto estava quieta e Kayn dormia com o ritmo estável dos que têm a consciência limpa ou a consciência que havia decidido ser limpa por enquanto.\n\nAurora ficou olhando para o teto por mais um tempo.\n\nDepois fechou os olhos."}]},{"id":"n22011c3e-823c-44b5-a4d4-170300a828ad","title":"ATO 3 — A FISSURA","chapters":[{"id":"nd4740bc8-021f-4bdf-8f7d-86cca3d8b6a7","title":"Capítulo 1: Quartos Vizinhos","text":"Conta-se a noite de uma casa pelo que os seus corredores guardam em silêncio.\n\nO corredor leste do Palácio das Marés tinha, às onze da no
